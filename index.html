        const fp=seg[0].fp;
        const dupF=pdfs.find(p=>p.fp===fp);
        const sid=dupF?dupF.sid:((lib.find(s=>s.fp===fp)||{}).sid)||('st'+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
        seg.forEach(r=>{r.sid=sid;});
        all.push(...seg);
        if(!gDet)gDet=guessCard(f.text);
        if(!dupF)pdfs.push({sid,name:f.name,buf:f.buf,fp});
      }
      if(gDet)IMPPDF.cardId=gDet;   /* 自動偵測到卡片 → 同步預設值 */
      if(!all.length){toast('未能從這些 PDF 提取到交易，請改用「貼上文字」或直接逐筆記錄','err');openSheet(pdfImportSheet(1));return;}
      IMPPDF.rows=all;IMPPDF.pdfs=pdfs;
      openSheet(pdfImportSheet(2));toast('擷取到 '+all.length+' 筆待確認；確認後 PDF 原件會存到本機，之後每筆可點 📄 跳回原單高亮對賬','ok');
    }catch(e){toast('讀取 PDF 失敗：'+(e.message||e),'err');}
  },
  'pdft-raw-go':()=>{
    const raw=($('pdft-raw')?$('pdft-raw').value:'')||'';
    IMPPDF.cardId=$('pdft-card')?$('pdft-card').value:IMPPDF.cardId;
    if(!raw.trim()){toast('請貼上月結單文字','err');return;}
    const rows=buildRows(raw);
    if(!rows.length){toast('未能從文字提取交易','err');return;}
    IMPPDF.rows=rows;openSheet(pdfImportSheet(2));toast('擷取到 '+rows.length+' 筆待確認','ok');
  },
  'pdft-back':()=>openSheet(pdfImportSheet(1)),
  'pdft-bottom':()=>{const sh=$('sheet');if(sh){sh.scrollTo({top:sh.scrollHeight,behavior:'smooth'});}},
  'pdft-edit':(d)=>{const o=(IMPPDF.openEdits=IMPPDF.openEdits||{});const i=+d.i;if(o[i])delete o[i];else o[i]=true;openSheet(pdfImportSheet(2));},
  'pdft-upd':(d,t)=>{const r=IMPPDF.rows[+d.i];if(!r)return;const f=d.f,v=t.value;
    if(f==='amount')r.amount=num(v);
    else if(f==='online')r.online=v===''?null:v==='1';
    else if(f==='card'){r.cardId=v;}   /* 修正：卡片下拉欄位對應 row.cardId，否則改了不生效 */
    else r[f]=v;},
  'ai-chat-open':()=>{IMPPDF.chat=IMPPDF.chat||[];openSheet(aiChatSheet());const l=$('ai-chat-log');if(l)l.scrollTop=l.scrollHeight;},
  'ai-chat-send':()=>{
    if(IMPPDF.chatBusy)return;
    const inp=$('ai-chat-in');
    const text=String(inp&&inp.value||'').trim();
    if(!text)return;
    if(inp)inp.value='';   /* 送出即清空；失敗會留「重試」按鈕，不必重打 */
    aiChatSendText(text);
  },
  'ai-chat-retry':d=>{
    if(IMPPDF.chatBusy)return;
    const i=+d.i;const m=IMPPDF.chat&&IMPPDF.chat[i];
    if(!m||!m.meta||!m.meta.retryText)return;
    const text=m.meta.retryText;
    IMPPDF.chat.splice(i,1);                                                        /* 移除錯誤泡泡 */
    if(IMPPDF.chat[i-1]&&IMPPDF.chat[i-1].role==='user')IMPPDF.chat.splice(i-1,1);   /* 移除失敗的那句，重發不重複 */
    aiChatSendText(text);
  },
  'ai-chat-back':()=>openSheet(pdfImportSheet(2)),
  'ai-chat-clear':()=>{IMPPDF.chat=[];openSheet(aiChatSheet());},
  'pdft-ai':async(d,t)=>{const btn=$('pdft-ai-btn')||t;if(IMPPDF.aiBusy)return;IMPPDF.aiBusy=true;if(btn){btn.disabled=true;btn.textContent='AI 標記中…';}
    try{
      const catSeed=S.data.categories.map(c=>c.id+':'+c.name+(c.keywords&&c.keywords.length?('→'+c.keywords.slice(0,5).join('/')):'')).join('; ');
      const rows=IMPPDF.rows.filter(r=>r.kind==='tx'&&r.amount>0).slice(0,150);
      if(!rows.length){toast('沒有可標記的消費','err');return;}
      const prompt='你是一個信用卡消費分類助手。可用分類(編號:名稱:關鍵字)：'+catSeed+
        '。請把每筆「商家」標記為其中一個 categoryid，並判斷 online 是否網上消費。只輸出 JSON 陣列（不要其他文字），格式：[{"i":0,"category":"online","online":true},...]。商家：\n'+
        rows.map((r,i)=>i+':'+(r.merchant||'?')).join('\n');
      const res=await aiChat(prompt);
      const arr=JSON.parse(String(res).replace(/```json|```/g,'').replace(/^[\[{]/,'[').trim());
      if(!Array.isArray(arr))throw new Error('AI 回傳格式錯誤');
      const valid=S.data.categories.map(c=>c.id);
      let n=0;
      for(const a of arr){const r=IMPPDF.rows[+a.i];if(r&&r.kind==='tx'&&typeof a.i==='number'){
        if(valid.indexOf(a.category)>=0){r.category=a.category;}
        if(a.online===true||a.online==='true')r.online=true;else if(a.online===false||a.online==='false')r.online=false;
        n++;}}
      IMPPDF.rows.forEach(r=>{const l=learnedLabel(r.merchant);if(l&&r.kind==='tx'){if(l.category)r.category=l.category;if(l.online!=null)r.online=!!l.online;}});
      openSheet(pdfImportSheet(2));toast('已標記 '+n+' 筆消費，可再逐筆微調','ok');
    }catch(e){toast('AI 標記失敗：'+(e.message||e),'err');}
    IMPPDF.aiBusy=false;
  },
  'pdft-save':()=>{
    if(!IMPPDF.rows.length){toast('沒有可匯入的交易','err');return;}
    let ok=0,reb=0,cred=0,skip=0,dup=0;
    mutate(dd=>{
      /* 導入真實月結單後，自動清除示例（demo）交易與回贈紀錄 */
      dd.transactions=(dd.transactions||[]).filter(t=>!t.demo);
      dd.credits=(dd.credits||[]).filter(c=>!c.demo);
      dd.rewardMonths=(dd.rewardMonths||[]).filter(r=>!r.demo);
      const rebG=new Map();   /* 回贈按「月結單指紋＋卡＋月份」分組，先加總再一次入帳 */
      /* 既有同鍵筆數（多重集）：重複匯入只會略過「鍵重複」的部分，同一份結單內兩筆相同的真實消費仍會入帳 */
      const txRecs=new Map(),crRecs=new Map();
      for(const t of dd.transactions){if(t.demo)continue;const k=t.cardId+'|'+t.date+'|'+r2(t.amount)+'|'+t.merchant;if(!txRecs.has(k))txRecs.set(k,[]);txRecs.get(k).push(t);}
      for(const c of dd.credits){if(c.demo)continue;const k=c.cardId+'|'+c.date+'|'+r2(c.amount)+'|'+c.kind+'|'+c.merchant;if(!crRecs.has(k))crRecs.set(k,[]);crRecs.get(k).push(c);}
      const seenT=new Map(),seenC=new Map();
      for(const r of IMPPDF.rows){
        const amount=num(r.amount);
        const date=(typeof r.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(r.date))?r.date:todayStr();
        const merchant=String(r.merchant||'').replace(/\s+/g,' ').trim()||'(未署名)';
        const kind=r.kind||'tx';
        if(!(amount>0)){skip++;continue;}
        const cardId=r.cardId||(S.data.cards[0]||{}).id;
        if(!cardId){skip++;continue;}
        if(kind==='tx'){
          const k=cardId+'|'+date+'|'+r2(amount)+'|'+merchant;
          const j=seenT.get(k)||0;seenT.set(k,j+1);
          const ex=(txRecs.get(k)||[])[j];
          if(ex){if(r.sid)ex.sid=r.sid;if(r.fp)ex.fp=r.fp;dup++;continue;}   /* 重複匯入同一筆 → 略過並補上 PDF 關聯 */
          const ctx={date,amount,category:r.category||'other',online:r.online===true};
          const nt=addTxFromCtx(ctx,cardId,merchant,{});
          if(nt){nt.fp=r.fp||undefined;nt.sid=r.sid||undefined;ok++;rememberLabel(dd,merchant,ctx.category,ctx.online,'manual');}
        }else if(kind==='rebate'){
          const month=date.slice(0,7),fp=String(r.fp||'');
          const key=fp+'|'+cardId+'|'+month;
          const g=rebG.get(key)||{fp,cardId,month,amount:0,sid:null,merch:[]};
          g.amount+=amount;g.sid=g.sid||r.sid||null;if(r.merchant&&g.merch.indexOf(r.merchant)<0)g.merch.push(r.merchant);
          rebG.set(key,g);
        }else{
          const k=cardId+'|'+date+'|'+r2(amount)+'|'+kind+'|'+merchant;
          const j=seenC.get(k)||0;seenC.set(k,j+1);
          const ex=(crRecs.get(k)||[])[j];
          if(ex){if(r.sid)ex.sid=r.sid;if(r.fp)ex.fp=r.fp;dup++;continue;}   /* 重複匯入同一筆 → 略過並補上 PDF 關聯 */
          dd.credits.push({id:uid(),date,cardId,amount:r2(amount),merchant,kind,note:'',fp:r.fp||undefined,sid:r.sid||undefined});cred++;
        }
      }
      /* 月結單回贈 → 彙入「回贈月結」；同一份月結單（指紋相同）重複匯入時覆蓋舊值，不重複累加 */
      for(const g of rebG.values()){
        dd.rewardMonths=dd.rewardMonths.filter(x=>{
          if(x.demo||x.cardId!==g.cardId||x.month!==g.month)return true;
          if(g.fp){
            if(x.fp===g.fp)return false;                     /* 同一份月結單重匯 → 覆蓋 */
            if(!x.fp&&(String(x.note||'').indexOf('月結單')>=0||!String(x.note||'').trim()))return false;  /* 舊版匯入值 → 以新值取代 */
          }
          return true;                                        /* 手動輸入／其他月結單 → 保留（分列累加） */
        });
        dd.rewardMonths.push({id:uid(),cardId:g.cardId,month:g.month,amount:r2(g.amount),note:'月結單匯入',fp:g.fp||undefined,sid:g.sid||undefined,srcMerch:g.merch.join(' | ')||undefined});
        reb++;
      }
    });
    /* 確認入帳 → PDF 原件存入本機 IndexedDB（僅本機保存，不上雲端不佔 localStorage） */
    if(IMPPDF.pdfs&&IMPPDF.pdfs.length){
      for(const p of IMPPDF.pdfs){
        pdfPut(p.sid,{name:p.name,data:p.buf,fp:p.fp,importedAt:Date.now(),size:p.buf.byteLength});
      }
    }
    closeSheet();
    toast('已匯入消費 '+ok+' 筆、月結回贈 '+reb+' 筆、還款/退款 '+cred+' 筆'+(dup?'（略過重複 '+dup+' 筆）':'')+(skip?'（略過 '+skip+' 筆）':'')+'；之後點任何一筆的 📄 可跳回原單高亮對賬','ok');
    IMPPDF.chat=null;IMPPDF.rows=[];IMPPDF.openEdits={};IMPPDF.pdfs=null;   /* 清空對話與暫存：交易已入帳 */
    UI.screen='records';render();
  },
  'cred-open':()=>openSheet(creditsSheet()),
  /* ---- 月結單 PDF 對賬 ---- */
  'pdf-view':d=>{
    const kind=d.kind||'tx';
    let rec=null;
    if(kind==='tx')rec=S.data.transactions.find(t=>t.id===d.id);
    else if(kind==='cred')rec=S.data.credits.find(c=>c.id===d.id);
    else rec=S.data.rewardMonths.find(r=>r.id===d.id);
    if(!rec)return;
    if(!rec.sid){toast('此記錄匯入時未保存 PDF 原件（舊記錄或手動新增）；把該月結單重新匯入一次即可自動關聯，重複筆數會略過不會重複入帳','err');return;}
    pdfViewOpen(rec.sid,pdfFocusOf(rec));
  },
  'pdf-lib':()=>pdfLibSheet(),
  'pdf-lib-open':d=>pdfViewOpen(d.sid,null),
  'pdf-lib-del':d=>{
    confirmSheet('刪除月結單原件','刪除這份 PDF 原件？已入帳的記錄不受影響，只是不能再跳回查看。','刪除',async()=>{
      await pdfDel(d.sid);
      toast('已刪除','ok');
      pdfLibSheet();
    });
  },
  'pdf-lib-clear':()=>confirmSheet('清除全部 PDF 原件','刪除所有已保存的月結單 PDF？已入帳的記錄不受影響。','全部刪除',async()=>{
    for(const s of await pdfAll()){await pdfDel(s.sid);}
    toast('已清除全部 PDF 原件','ok');
    pdfLibSheet();
  }),
  'pdf-page':d=>{
    const p=PDFVIEW.page+Number(d.p||0);
    if(p<1||p>PDFVIEW.numPages)return;
    PDFVIEW.page=p;
    pdfRenderPage().catch(e=>toast('渲染失敗：'+(e.message||e),'err'));
  },
  'cred-del':d=>confirmSheet('刪除記錄','刪除此回贈／還款記錄？','刪除',()=>{
    mutate(dd=>{dd.credits=(dd.credits||[]).filter(c=>c.id!==d.id);});toast('已刪除','ok');openSheet(creditsSheet());
  }),
  'ai-open':()=>openSheet(aiSheetHTML()),
  'ai-test':async(d,t)=>{
    const btn=t;
    const base=($('ai-base').value||'').trim()||AI_DEF.base;
    const key=($('ai-key').value||'').trim();
    const model=($('ai-model').value||'').trim()||AI_DEF.model;
    const done=msg=>{const o=$('ai-test-out');if(o)o.textContent=msg;if(btn){btn.disabled=false;btn.textContent='測試連線';}};
    if(btn){btn.disabled=true;btn.textContent='測試中…';}
    if(!/^https?:\/\//.test(base)){done('✗ 地址須以 http(s):// 開頭，目前是：'+base);return;}
    const ac=('AbortController' in window)?new AbortController():null;
    const timer=ac?setTimeout(()=>ac.abort(),20000):null;
    try{
      const t0=Date.now();
      const res=await fetch(base.replace(/\/+$/,'')+'/models',{headers:{'Authorization':'Bearer '+key},signal:ac?ac.signal:undefined});
      const ms=Date.now()-t0;
      if(res.ok)done('✓ 連線成功（'+ms+'ms）。地址與 Key 正常，模型 '+model+'。記得按「儲存」。');
      else if(res.status===401||res.status===403)done('✗ 網路通了，但 Key 無效（HTTP '+res.status+'）。請檢查 API Key 是否正確／有效。');
      else if(res.status===404)done('△ 網路通了（HTTP 404：此服務沒有 /models 清單，部分代理如此，屬正常）。若 AI 對話仍失敗，可能是模型名稱不對。');
      else done('△ 收到 HTTP '+res.status+'：地址可達但被服務端拒絕，請對照服務文件確認。');
    }catch(e){
      done('✗ '+aiNetErr(e,base));
    }finally{if(timer)clearTimeout(timer);}
  },
  'ai-save':()=>{
    let c={on:true,base:($('ai-base').value||'').trim(),key:($('ai-key').value||'').trim(),model:($('ai-model').value||'').trim()||'gpt-4o-mini'};
    if(!c.key){toast('請輸入 API Key','err');return;}
    if(!/^https?:\/\//.test(c.base)){toast('請輸入完整介面地址（含 https://）','err');return;}
    saveAiCfg(c);closeSheet();toast('AI 設定已儲存','ok');
  },
  'know-clear':()=>confirmSheet('清空學習記憶','將清除所有自動分類記憶，可再用月結單重新學習。','清空',()=>{
    mutate(dd=>{dd.knowledge=[];});toast('已清空','ok');
  }),
  'know-del':d=>{mutate(dd=>{dd.knowledge=(dd.knowledge||[]).filter(k=>k.id!==d.id);});toast('已移除','ok');}
};

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-action]');
  if(!t)return;
  const a=t.dataset.action;
  const fn=ACTIONS[a];
  if(!fn)return;
  e.preventDefault();
  let r;
  try{r=fn(t.dataset,t);}catch(err){toast('發生錯誤：'+(err.message||err),'err');return;}
  if(r&&typeof r.catch==='function')r.catch(err=>toast(err.message||'操作失敗','err'));
});
document.addEventListener('change',e=>{
  const t=e.target.closest('[data-change]');
  if(!t)return;
  const fn=ACTIONS[t.dataset.change];
  if(!fn)return;
  try{fn(t.dataset,t);}catch(err){toast('發生錯誤：'+(err.message||err),'err');}
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='ask-amount')askForm.amount=e.target.value;
  else if(id==='ask-merchant')askForm.merchant=e.target.value;
  else if(id==='ask-date')askForm.date=e.target.value;
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='ai-chat-in'&&!e.shiftKey&&!e.isComposing){   /* AI 對話框：Enter 送出 */
    e.preventDefault();const b=$('sheet').querySelector('[data-action="ai-chat-send"]');if(b&&!b.disabled)b.click();return;
  }
  if(e.key==='Enter'&&!$('sheet-wrap').hidden&&e.target.tagName!=='TEXTAREA'){
    const pb=$('sheet').querySelector('.btn-primary');
    if(pb){e.preventDefault();pb.click();}
  }
});

/* ============ 啟動 ============ */
function boot(){
  load();
  ensureRealCards();
  loadSyncCfg();
  render();
  if(SYNC.cfg){
    if(crypto&&crypto.subtle){
      deriveKey(syncCodeOf(SYNC.cfg)).then(k=>{SYNC.key=k;pullNow(true);})
        .catch(()=>{SYNC.state='err';SYNC.errMsg='金鑰還原失敗';});
    }else{SYNC.state='err';SYNC.errMsg='瀏覽器不支援加密';}
  }
  setInterval(()=>{
    if(SYNC.cfg&&SYNC.key&&!document.hidden&&!SYNC.busy&&$('sheet-wrap').hidden)pullNow(true);
  },30000);
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden&&SYNC.cfg&&SYNC.key&&!SYNC.busy)pullNow(true);
  });
  window.addEventListener('pagehide',()=>{if(SYNC.cfg&&SYNC.key&&!SYNC.busy)pushNow();});
}
boot();
</script>
