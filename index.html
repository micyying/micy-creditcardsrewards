<meta name="theme-color" content="#6C5CE7">
<style>
:root{
  --bg:#F1EFFA; --panel:#FFFFFF; --ink:#241E3E; --muted:#7E769F; --line:#E7E3F5;
  --brand:#6C5CE7; --brand-d:#4834D4; --grad:linear-gradient(135deg,#6C5CE7,#4834D4);
  --ok:#0E9663; --okbg:#E2F7EE; --warn:#B3730E; --warnbg:#FCF1DC; --bad:#D64545; --badbg:#FBE7E7;
  --chipbg:#EEEBFB; --radius:18px; --shadow:0 6px 22px rgba(72,52,212,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,'PingFang HK','Noto Sans HK','Helvetica Neue',Arial,sans-serif;
  padding-bottom:calc(100px + env(safe-area-inset-bottom))}
body.locked{overflow:hidden}
#app{max-width:720px;margin:0 auto}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--ink);border:1.5px solid var(--line);border-radius:12px;
  padding:10px 12px;background:#FBFAFE;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand)}
textarea{resize:vertical;min-height:110px}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=date]{padding:9px 10px}

/* header */
.hdr{background:var(--grad);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 18px;border-radius:0 0 24px 24px;
  display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow);position:relative;z-index:2}
.hdr-l{display:flex;align-items:center;gap:8px;min-width:0}
.hdr-logo{width:40px;height:40px;border-radius:9px;display:block;flex:none;
  box-shadow:0 2px 10px rgba(20,10,60,.28);border:1.5px solid rgba(255,255,255,.35)}
.hdr .brush{font-family:'Songti TC','Songti SC','STSong','SimSun','宋體','宋体',serif;
  font-weight:700;font-size:19px;letter-spacing:1px;white-space:nowrap}
.hdr-sync{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border-radius:99px;
  padding:6px 12px;font-size:12px;color:#EDEAFF;max-width:46%}
.hdr-sync:active{background:rgba(255,255,255,.28)}
.dot{width:9px;height:9px;border-radius:99px;background:#B9B1E8;flex:none}
.dot.ok{background:#7BF2C0;box-shadow:0 0 6px rgba(123,242,192,.8)}
.dot.err{background:#FF9B9B}
.dot.busy{background:#FFD97B}

/* panels */
.panel{background:var(--panel);border-radius:var(--radius);padding:16px;margin:14px 14px 0;box-shadow:var(--shadow)}
.p-title{font-size:15px;font-weight:700;margin:0 0 4px}
.p-sub{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.divider{height:1px;background:var(--line);margin:12px 0}
.mini{font-size:12px;color:var(--muted)}

/* 卡片表現：每張卡整齊排版 */
.perf-card{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;margin:8px 0 2px;background:#fff;box-shadow:0 1px 3px rgba(15,10,60,.04)}
.perf-head{display:flex;align-items:center;gap:8px;padding:11px 13px}
.perf-dot{width:13px;height:13px;border-radius:4px;flex:none}
.perf-name{flex:1;min-width:0;font-weight:800;font-size:14px;color:#18132E;line-height:1.3;overflow-wrap:anywhere;word-break:break-word;white-space:normal}
.perf-diff{flex:none;font-weight:800;font-size:13px}
.perf-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line)}
.perf-cell{background:#FBFBFE;padding:8px 13px}
.perf-k{font-size:11px;color:var(--muted);margin-bottom:2px}
.perf-v{font-size:14px;font-weight:800;color:#18132E}
.perf-foot{display:flex;justify-content:space-between;gap:10px;align-items:flex-end;padding:10px 13px;flex-wrap:wrap}
.perf-foot .pf{font-size:12.5px;line-height:1.35}
.perf-foot b{font-size:14px}
.perf-src{padding:0 13px 11px;font-size:11.5px;color:var(--muted);line-height:1.4}
.good{color:var(--ok,#0E9663)}.bad{color:var(--bad,#D64545)}

/* 可折疊面板 */
.tgl-summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;user-select:none;margin:0}
.tgl-summary::-webkit-details-marker{display:none}
.tgl-summary::after{content:'▾';color:var(--muted);transition:transform .18s;font-size:14px;flex:none}
details.panel[open]>.tgl-summary::after{transform:rotate(180deg)}
details.panel summary.tgl-summary .p-title{font-size:15px;font-weight:700;margin:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:13px;
  padding:11px 16px;font-weight:700;font-size:15px;transition:transform .06s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(72,52,212,.35)}
.btn-ghost{background:var(--chipbg);color:var(--brand-d)}
.btn-danger{background:var(--badbg);color:var(--bad)}
.btn-block{display:flex;width:100%}
.btn-sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn-link{color:var(--brand);font-weight:600;font-size:13.5px;padding:4px 2px}
.btn:disabled{opacity:.45;pointer-events:none}

/* fields */
.field{margin-bottom:12px}
.f-lbl{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.fhint{font-size:11.5px;color:var(--muted);margin-top:4px}

/* ask */
.big-amt{display:flex;align-items:baseline;gap:6px;margin:4px 0 14px}
.big-amt .cur{font-size:22px;font-weight:800;color:var(--brand)}
.big-amt input{border:0;border-bottom:2.5px solid var(--brand);background:transparent;border-radius:0;
  font-size:34px;font-weight:800;padding:2px 4px;color:var(--ink)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 4px}
.chip{background:#FBFAFE;border:1.5px solid var(--line);border-radius:13px;padding:9px 4px 7px;text-align:center;
  font-size:12px;font-weight:600;color:var(--ink)}
.chip .ci{font-size:19px;display:block;line-height:1.25}
.chip.on{background:var(--chipbg);border-color:var(--brand);color:var(--brand-d)}
.seg{display:flex;background:var(--chipbg);border-radius:12px;padding:4px;margin-top:10px}
.seg button{flex:1;border-radius:9px;padding:8px 0;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--brand-d);box-shadow:0 2px 8px rgba(72,52,212,.18)}

/* badges (三概念) */
.b{display:inline-flex;align-items:center;border-radius:99px;padding:2.5px 9px;font-size:11px;font-weight:700;vertical-align:2px}
.b-off{background:#E3EDFF;color:#2B63D8}
.b-est{background:#EEEBFB;color:#6C5CE7}
.b-act{background:var(--okbg);color:var(--ok)}
.b-demo{background:var(--warnbg);color:var(--warn)}
.b-dim{background:#F0EFF4;color:#8B8699}

/* recommendation */
.rec-top{background:#fff;border:2px solid var(--brand);border-radius:20px;padding:18px 18px 16px;
  margin:14px 14px 0;box-shadow:0 8px 26px rgba(72,52,212,.16);position:relative;overflow:hidden}
.rec-top::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:var(--grad)}
.rec-label{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:1px}
.rec-name{font-size:22px;font-weight:800;margin:3px 0 1px}
.rec-amount{font-size:34px;font-weight:800;color:var(--brand-d);letter-spacing:-.5px;margin:6px 0 2px}
.rec-amount small{font-size:14px;font-weight:700;color:var(--muted)}
.rec-line{font-size:13.5px;color:#5C5479;margin-top:6px}
.rec-cred{display:flex;align-items:center;gap:7px;margin-top:10px}
.rec-act{margin-top:14px}
.alt-head{margin:18px 18px 6px;font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:1px}
.alt-row{background:#fff;border-radius:15px;padding:12px 16px;margin:8px 14px 0;box-shadow:var(--shadow);
  display:flex;justify-content:space-between;align-items:center}
.alt-row .nm{font-weight:700;font-size:15px}
.alt-row .amt{font-weight:800;color:var(--brand-d);font-size:17px;white-space:nowrap}
.alt-row .why{font-size:11.5px;color:var(--muted);margin-top:2px;max-width:70%}
.rec-empty{background:#fff;border-radius:15px;margin:8px 14px 0;padding:16px;box-shadow:var(--shadow);
  font-size:13.5px;color:var(--muted);text-align:center}

.deck-card{position:relative;display:block;width:100%;padding:0;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;aspect-ratio:300/190}
.deck-card .df{width:100%;height:100%;object-fit:cover;display:block;border-radius:16px;box-shadow:0 12px 24px rgba(15,10,60,.28)}
.deck-card .dn{position:absolute;top:10px;right:10px;left:10px;font-size:11px;font-weight:800;color:#fff;letter-spacing:.3px;background:rgba(10,6,40,.45);backdrop-filter:blur(2px);padding:3px 9px;border-radius:14px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.deck-card + .deck-card{margin-top:-50%}
.deck-card:not(:first-child) .dn{opacity:.95}
.deck-card:hover,.deck-card:active{position:relative;z-index:30;transform:translateY(-5px)}
.deck-card:hover .df{box-shadow:0 18px 32px rgba(15,10,60,.34)}
/* 直向卡（如 Chill／國泰／Mox／AEON）：以原直向設計呈現，置中 */
.deck-card.por{width:44%;aspect-ratio:190/300;margin-left:auto;margin-right:auto}

.deck-prev{width:100%;max-width:330px;margin:6px auto 12px;border-radius:16px;box-shadow:0 12px 24px rgba(15,10,60,.28);display:block}

/* month nav / stat strip */
.mon-nav{display:flex;align-items:center;justify-content:space-between;margin:14px 14px 0}

/* tabs */
.tabs{display:flex;background:#fff;border-radius:13px;padding:4px;margin:14px 14px 0;box-shadow:var(--shadow)}

/* filter row */

/* table */
.table{width:100%;border-collapse:collapse;font-size:12px}
.table th{text-align:left;color:var(--muted);font-weight:700;padding:5px 6px;border-bottom:1.5px solid var(--line);white-space:nowrap}

/* sheet modal */
#sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}

/* 確認月結單列表：右下角「拉到底」浮動把手 */

  z-index:6;display:flex;align-items:center;gap:6px;background:rgba(108,92,231,.95);color:#fff;

/* ---- 月結單 PDF 對賬：行內「📄」入口 + 查看器 ---- */
.pdf-btn{border:none;background:#EEF0FE;color:#4A3FBF;border-radius:7px;padding:1px 8px;font-size:11px;font-weight:800;

/* ---- 卡片設置（iOS 群組樣式） ---- */

.codebox{background:#241E3E;color:#EDEAFF;border-radius:13px;padding:12px 13px;font-family:ui-monospace,Menlo,monospace;

/* toasts */
#toasts{position:fixed;top:calc(10px + env(safe-area-inset-top));left:0;right:0;display:flex;flex-direction:column;

/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;justify-content:center;
  background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);

<script>
'use strict';

/* ============ utils ============ */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const num=v=>{const n=parseFloat(String(v).replace(/,/g,''));return isFinite(n)?n:0;};
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const pad2=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());};
const nowMonth=()=>todayStr().slice(0,7);
const fmtHKD=n=>'HK$'+r2(n||0).toLocaleString('en-HK',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtPct=fr=>{const p=+(fr*100).toFixed(2);return p+'%';};
const monthAdd=(m,k)=>{const[y,mm]=m.split('-').map(Number);const d=new Date(y,mm-1+k,1);return d.getFullYear()+'-'+pad2(d.getMonth()+1);};
const monthLabel=m=>m.slice(0,4)+'年'+(+m.slice(5,7))+'月';
const fmtDate=d=>d?d.slice(8,10)+'/'+d.slice(5,7):'';
const fmtDateFull=d=>d?d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4):'';
const fmtTime=ts=>{const d=new Date(ts||0);return d.getHours()?pad2(d.getHours())+':'+pad2(d.getMinutes()):'';};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dateAddStr=(ds,days)=>{const[y,mo,d]=String(ds).split('-').map(Number);const dt=new Date(y,mo-1,d+days);return dt.getFullYear()+'-'+pad2(dt.getMonth()+1)+'-'+pad2(dt.getDate());};
const monthsBetween=(m1,m2)=>{const a=+m1.slice(0,4)*12+(+m1.slice(5,7)-1),b=+m2.slice(0,4)*12+(+m2.slice(5,7)-1);return Math.max(0,b-a);};
const rand36=n=>{const c='abcdefghjkmnpqrstuvwxyz23456789';let s='';for(let i=0;i<n;i++)s+=c[Math.floor(Math.random()*c.length)];return s;};
const ICON=(document.querySelector('link[rel="apple-touch-icon"]')||{}).href||'';

function parseMoney(v){
  if(typeof v==='number')return isFinite(v)?v:null;
  let t=String(v??'').trim();if(!t)return null;
  let neg=false;
  if(/^\(.*\)$/.test(t)){neg=true;t=t.slice(1,-1);}
  if(t[0]==='-'){neg=true;t=t.slice(1);}
  t=t.replace(/[^0-9.]/g,'');
  if(!t)return null;
  const n=parseFloat(t);
  if(!isFinite(n))return null;
  return neg?-n:n;
}
const iso=(y,mo,d)=>{y=+y;mo=+mo;d=+d;if(y<100)y+=2000;if(mo<1||mo>12||d<1||d>31)return null;return y+'-'+pad2(mo)+'-'+pad2(d);};
function parseDateAny(v){
  const t=String(v??'').trim();if(!t)return null;
  const MON={JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,SEPT:9,OCT:10,NOV:11,DEC:12};
  let m;
  if(m=t.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/))return iso(m[1],m[2],m[3]);
  if(m=t.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/))return iso(m[3],m[2],m[1]);
  if(m=t.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2})$/))return iso(2000+ +m[3],m[2],m[1]);
  if(m=t.match(/^(\d{1,2})[-\s\/]([A-Za-z]{3,9})[-\s\/](\d{2,4})$/)){const mo=MON[m[2].toUpperCase()];return mo?iso(m[3],mo,m[1]):null;}
  if(m=t.match(/^(\d{4})年(\d{1,2})月(\d{1,2})日?$/))return iso(m[1],m[2],m[3]);
  return null;
}
function detectDelim(line){
  const cnt={',':0,';':0,'\t':0};let q=false;
  for(const ch of line){if(ch==='"')q=!q;else if(!q&&cnt[ch]!=null)cnt[ch]++;}
  const en=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
  return en[0][1]>0?en[0][0]:',';
}
function parseCSV(text){
  text=String(text||'').replace(/^\uFEFF/,'').replace(/\r\n/g,'\n');
  const firstLine=(text.split('\n')[0]||'');
  const delim=detectDelim(firstLine);
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}
    else if(ch==='"')q=true;
    else if(ch===delim){row.push(cell);cell='';}
    else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
    else if(ch!=='\r')cell+=ch;
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows.map(r=>r.map(c=>c.trim())).filter(r=>r.length>1&&r.some(c=>c!==''));
}
const HEADER_HINT=/日期|date|交易|描述|desc|details|detail|remarks|remark|merchant|商戶|說明|摘要|amount|金額|數額|amt|debit|credit|支賬|存賬|結餘|balance/i;
const looksLikeHeader=r=>r.some(c=>c&&c.length<40&&HEADER_HINT.test(c));

/* ============ seed（示例資料） ============ */
const SEED_CATEGORIES=[
 {id:'dining',name:'餐飲',emoji:'🍽️',keywords:['餐廳','RESTAURANT','MAXIM','美心','麥當勞','MCDONALD','MCD','KFC','必勝客','PIZZA','大家樂','大快活','STARBUCK','星巴克','PACIFIC COFFEE','CAFE','CAFÉ','SUSHI','壽司','爭鮮','譚仔','MARUTAI','一蘭','拉麵','RAMEN','FOOD','茶餐廳','SUBWAY','DOMINO','DELIVER','FOODPANDA','戶戶送','KEEFOOD','KIKURO','牛角','AYAM','客家好味']},
 {id:'grocery',name:'超市雜貨',emoji:'🛒',keywords:['WELLCOME','惠康','PARKN','百佳','AEON','UNY','CITYSUPER','CITY SUPER','U SELECT','優品360','759','阿信屋','7-ELEVEN','7 ELEVEN','OK MART','OK便利店','萬寧','MANNINGS','屈臣氏','WATSON','MARKET PLACE','TASTE','FUSION','華潤萬家','U購']},
 {id:'online',name:'網購',emoji:'🛍️',keywords:['AMAZON','TAOBAO','淘寶','TMALL','天貓','JD.COM','京東','HKTV','ZALORA','SHEIN','TEMU','SHOPEE','EBAY','ALIEXPRESS','APPLE.COM','GOOGLE','STRIPE','SHOPIFY','閃購','HOSHIKO']},
 {id:'transport',name:'交通',emoji:'🚇',keywords:['MTR','港鐵','OCTOPUS','八達通','KMB','九巴','KOWLOON MOTO','KOWLOON MOTOR','龍運','CITYBUS','城巴','NWFB','新巴','LONG WIN','TAXI','的士','UBER','HK TAXI','滴滴','GMB','小巴','STAR FERRY','天星小輪','HARBOUR']},
 {id:'fuel',name:'汽油',emoji:'⛽',keywords:['SHELL','加德士','CALTEX','ESSO','CNOOC','中石化','SINOPEC','PETRO CHINA','FUEL','油站','CIRCLE K']},

/* ---- 真實卡片：擬真卡面（SVG） ---- */
function faceURI(o){
  o=o||{};
  const c1=o.c1||'#3A2F88',c2=o.c2||'#6C5CE7';
  const bank=o.bank||'CARD';
  const bs=bank.length>11?11:bank.length>7?13:16;
  const wm=(o.label||'').toUpperCase();
  // 網路標誌（右下）
  const org=o.org||'mc';
  let net='';
  if(org==='visa'){
    net=`<text x='282' y='170' text-anchor='end' font-family='Arial,Helvetica,sans-serif' font-style='italic' font-weight='800' font-size='17' fill='#fff' letter-spacing='1'>VISA</text>
<rect x='258' y='149' width='24' height='1.6' fill='rgba(255,255,255,.55)'/>`;
  }else if(org==='upi'){
    net=`<g><rect x='246' y='147' width='8' height='25' rx='2' fill='#E60012'/><rect x='258' y='147' width='8' height='25' rx='2' fill='#00447C'/><rect x='270' y='147' width='8' height='25' rx='2' fill='#009BDA'/></g>`;
  }else{ /* mastercard */
    net=`<g><circle cx='261' cy='162' r='15' fill='#EB001B'/><circle cx='273' cy='162' r='15' fill='#F79E1B' fill-opacity='.90'/></g>`;
  }
  const wave=`<g fill='none' stroke='rgba(255,255,255,.85)' stroke-width='2.2' opacity='.9'><path d='M252 28 a11 11 0 1 1 9-2'/><path d='M246 23 a16 16 0 1 1 13-4'/></g>`;
  const pat=`<path d='M300 0 L248 190 L300 190 Z' fill='rgba(255,255,255,.055)'/>
<path d='M0 66 L60 190 L0 190 Z' fill='rgba(8,4,30,.09)'/>
<path d='M150 190 L214 0 L262 0 L198 190 Z' fill='rgba(255,255,255,.05)'/>`;
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='300' height='190' viewBox='0 0 300 190'>
<defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='${c1}'/><stop offset='1' stop-color='${c2}'/></linearGradient></defs>
${pat}
<rect width='300' height='190' rx='18' fill='url(#g)'/>
<rect x='0' y='0' width='300' height='7' fill='rgba(255,255,255,.26)'/>
${wm?`<text x='16' y='112' font-family='Arial,Helvetica,sans-serif' font-weight='800' font-size='42' letter-spacing='5' fill='rgba(255,255,255,.12)'>${wm}</text>`:''}
<rect x='16' y='18' width='40' height='40' rx='9' fill='rgba(255,255,255,.16)'/>
<text x='36' y='44' font-family='Arial,Helvetica,sans-serif' font-weight='800' font-size='20' fill='#fff' text-anchor='middle'>${bank.split(' ')[0]}</text>
${o.bankEn?`<text x='16' y='72' font-family='Arial,Helvetica,sans-serif' font-weight='600' font-size='9.5' fill='rgba(255,255,255,.78)' letter-spacing='1.6'>${o.bankEn}</text>`:''}
${wave}
<text x='284' y='40' text-anchor='end' font-family='Arial,Helvetica,sans-serif' font-weight='700' font-size='12' fill='#fff'>${o.tag||o.label||''}</text>
<rect x='16' y='84' width='46' height='31' rx='6' fill='${o.chip||'#E8D48B'}'/>
<rect x='25' y='92' width='28' height='15' rx='2.5' fill='none' stroke='${o.chipL||'#9a7a2f'}' stroke-width='1.6'/>
<text x='16' y='134' font-family='ui-monospace,Menlo,monospace' font-weight='700' font-size='22' letter-spacing='1.4' fill='#fff' opacity='.96'>••••&nbsp;&nbsp;••••&nbsp;&nbsp;••••&nbsp;&nbsp;${o.num4||'8888'}</text>
<text x='16' y='154' font-family='Arial,Helvetica,sans-serif' font-size='7.5' fill='rgba(255,255,255,.62)' letter-spacing='1.6'>VALID THRU</text>
<text x='16' y='168' font-family='Arial,Helvetica,sans-serif' font-weight='700' font-size='12' fill='#fff'>${o.exp||'12/27'}</text>
<text x='116' y='168' font-family='Arial,Helvetica,sans-serif' font-weight='600' font-size='11' fill='#fff' opacity='.92'>${o.holder||'CARDHOLDER'}</text>
${net}
</svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
/* 卡面 URL：卡已有自訂卡面就用，否則依卡片資料即時生成擬真卡面 */
function cardFaceURL(c){
  if(c&&c.face)return c.face;
  return faceURI({c1:(c&&c.color)||'#6C5CE7',c2:'#3A2F88',bank:(c&&c.name)||'CARD',
    label:(c&&c.name)||'',tag:((c&&c.bank)||'CARD').toUpperCase()});
}

const FACE_REV=4; /* 卡面版本：改版後強制更新已儲存卡片的真实卡面 */
const RULES_REV=2; /* 規則版本：碌邊張(swipewhich)同步後強制更新回贈規則（手動改過的卡除外） */
const SYNC_RULE_ID=/^r-[a-z0-9_]+-[0-9]/; /* 碌邊張同步規則的 id 格式（r-卡id-編號）；用戶自建規則不符合此格式 */
/* 同步規則合併：實質變更（率/上限/分類/渠道/門檻）→ 舊版保留至昨日、新版今日起生效，
   舊帳單測算沿用舊規則；名稱/到期日變動則原地更新；已消失的同步規則保留作歷史（終結於昨日）。
   baseId 記錄版本所屬家族（源自碌邊張哪條規則），重複同步不會重複開新版本 */
function mergeSyncedRules(card,incoming){
  const today=todayStr(),yest=dateAddStr(today,-1);
  const cur=(card.rules||[]).slice();
  const out=[];let changedAt=null;
  const famIds=new Set((incoming||[]).map(x=>x.id));
  for(const nr of(incoming||[])){
    const fam=cur.filter(x=>x.id===nr.id||x.baseId===nr.id);
    const or=fam.length?fam.slice().sort((a,b)=>String(b.end||'9999').localeCompare(String(a.end||'9999')))[0]:null;
    const active=or&&(!or.end||or.end>=today);
    if(!or){out.push(Object.assign({},nr));continue;}                                   /* 新規則：直接加入 */
    const same=(or.rate===nr.rate)&&(or.capMonth===nr.capMonth)&&(or.category===nr.category)
      &&(or.online===nr.online)&&(or.minSpend===nr.minSpend);
    if(same&&active){                                                                   /* 只改名/到期日：原地更新 */
      out.push.apply(out,fam.map(v=>v===or?Object.assign({},or,{name:nr.name,end:nr.end||null}):v));
      continue;
    }
    if(!same){                                                                          /* 實質變更：全部在用版本終結於昨日 */
      for(const v of fam){if(!v.end||v.end>yest)v.end=(v.start&&v.start>yest)?v.start:yest;}
    }
    out.push.apply(out,fam);
    if(!(nr.end&&nr.end<today)){                                                        /* 新版今日起生效（已過期則不加） */
      out.push(Object.assign({},nr,{id:nr.id+'-'+rand36(5),baseId:nr.id,start:today}));
    }
    changedAt=today;
  }
  for(const or of cur){
    if(famIds.has(or.id)||famIds.has(or.baseId||''))continue;                          /* 家族仍在（含衍生版本） */
    if(!SYNC_RULE_ID.test(String(or.id||''))){out.push(Object.assign({},or));continue;}  /* 用戶自建規則：完整保留 */
    const e=(!or.end||or.end>yest)?((or.start&&or.start>yest)?or.start:yest):or.end;     /* 官方下架：保留作歷史 */
    out.push(Object.assign({},or,{end:e}));
    changedAt=changedAt||today;
  }
  if(changedAt)card.rulesChangedAt=today;
  return out;
}

/* 資料遷移：載入本機、雲端同步覆蓋、JSON 匯入／備份還原後皆會套用，回傳是否有改動 */
function migrateData(){
  /* 遷移 v2.7：把誤判為「回贈」的信用卡還款改回「payment」，避免大額還款計入回贈
     （僅針對描述含還款字眼的 cred 記錄，保留退款/真正回贈不動） */
  let mig=false;
  for(const c of S.data.credits){
    if((c.kind==='rebate'||c.kind==='credit')&&PAY_DESC.test(String(c.merchant||c.note||''))){c.kind='payment';mig=true;}
  }
  /* 遷移 v2.8：修正「7 月 Chill 卡回贈一千多」的三個根源——
     1) 同一份月結單重複匯入造成的重複交易／入賬記錄；
     2) 舊版把大額還款（如 PAYMENT THANK YOU 414.74 CR）誤計為回贈，並在「回贈月結」累積；
     3) 舊版逐筆回贈（credits）與月結回贈（rewardMonths）並存 → 雙重計算。 */
  let mig28=0;
  {
    /* 整份月結單重複匯入的偵測：同一卡出現 ≥6 種「同日同額同名」重複鍵，
       只可能是整份重匯（零星的同日重複消費不會這樣）→ 每鍵只留一筆。
       以「卡」為單位偵測（非按月），同一份結單的交易常跨兩個月 */
    const byM=new Map();
    for(const t of S.data.transactions){
      if(t.demo)continue;
      const mk=t.cardId;
      const k=t.date+'|'+t.amount+'|'+t.merchant;
      const o=byM.get(mk)||new Map();
      o.set(k,(o.get(k)||0)+1);byM.set(mk,o);
    }
    const cut=new Set();
    for(const [mk,o] of byM){
      let d=0;for(const v of o.values())if(v>=2)d++;
      if(d>=6)for(const k of o.keys())cut.add(mk+'|'+k);
    }
    if(cut.size){
      const kept=new Set();
      S.data.transactions=S.data.transactions.filter(t=>{
        if(t.demo)return true;
        const ck=t.cardId+'|'+t.date+'|'+t.amount+'|'+t.merchant;
        if(!cut.has(ck))return true;
        if(kept.has(ck)){mig28++;return false;}
        kept.add(ck);return true;
      });
    }
    const seenC=new Set();
    S.data.credits=S.data.credits.filter(c=>{
      if(c.demo)return true;
      const k=c.cardId+'|'+c.date+'|'+c.amount+'|'+c.kind+'|'+c.merchant;
      if(seenC.has(k)){mig28++;return false;}
      seenC.add(k);return true;
    });
    S.data.rewardMonths=(S.data.rewardMonths||[]).filter(r=>{
      if(!rmImplausible(r))return true;
      const n=String(r.note||'');
      if(n.trim()&&n.indexOf('月結單')<0)return true;   /* 用戶手動輸入且有備註 → 不自動動 */
      mig28++;return false;                              /* 舊版匯入的異常值 → 移除，重匯月結單即恢復正確值 */
    });
    const reb=new Map();                                  /* 舊逐筆回贈 → 併入月結回贈（同卡同月取較大值） */
    for(const c of S.data.credits){
      if(c.kind!=='rebate'||c.demo)continue;
      const m=String(c.date||'').slice(0,7);if(m.length<7)continue;
      const k=c.cardId+'|'+m;
      reb.set(k,(reb.get(k)||0)+(c.amount||0));
    }
    if(reb.size){
      for(const [k,v] of reb){
        const [cardId,m]=k.split('|');
        const ex=S.data.rewardMonths.find(r=>r.cardId===cardId&&r.month===m&&!r.demo);
        if(ex)ex.amount=r2(Math.max(ex.amount||0,v));
        else S.data.rewardMonths.push({id:uid(),cardId,month:m,amount:r2(v),note:'月結單匯入'});
      }
      S.data.credits=S.data.credits.filter(c=>c.kind!=='rebate'||c.demo);
      mig28+=reb.size;
    }
  }
  return mig||mig28>0;
}

/* ============ 推薦引擎 ============ */
function ruleMatches(rule,ctx){
  if(rule.category!==ctx.category)return false;
  if(rule.online===true&&!ctx.online)return false;
  if(rule.online===false&&ctx.online)return false;
  if(rule.start&&ctx.date<rule.start)return false;
  if(rule.end&&ctx.date>rule.end)return false;
  if(rule.minSpend&&ctx.amount<rule.minSpend)return false;
  return true;
}
function ruleBonusUsed(ruleId,month){
  let s=0;
  for(const tx of S.data.transactions){
    if(tx.ruleId===ruleId&&tx.date.slice(0,7)===month)s+=tx.bonus||0;
  }
  return r2(s);
}
function evalCardFor(card,ctx){
  const month=ctx.date.slice(0,7);
  const base=ctx.amount*(card.baseRate||0);
  let best=null;
  const rules=[...(card.rules||[])].sort((a,b)=>(a.priority||0)-(b.priority||0));
  for(const r of rules){
    if(!ruleMatches(r,ctx))continue;
    const raw=ctx.amount*(r.rate||0);
    const capLeft=r.capMonth?Math.max(0,r.capMonth-ruleBonusUsed(r.id,month)):Infinity;
    const eff=Math.min(raw,capLeft);
    if(!best||eff>best.eff+1e-9)best={r,eff,raw,capLeft,capped:raw>capLeft+1e-9};
  }
  if(!best){
    return {card,base,bonus:0,reward:base,ruleId:null,ruleName:'基本回贈',rate:card.baseRate||0,
      capLeft:Infinity,capped:false,reason:card.baseRate?'基本回贈 '+fmtPct(card.baseRate):'無回贈規則'};
  }
  const parts=[];
  parts.push(best.r.name+' '+fmtPct(best.r.rate)+'（額外）');
  if(best.capped)parts.push('本月額度僅餘 '+fmtHKD(best.capLeft));
  else if(best.r.capMonth)parts.push('本月尚餘 '+fmtHKD(best.capLeft)+' 額度');
  if(best.r.online===true)parts.push('網上消費');
  if(best.r.online===false)parts.push('門市消費');
  if(best.r.minSpend)parts.push('滿 '+fmtHKD(best.r.minSpend));
  if(card.baseRate)parts.push('另計基本 '+fmtPct(card.baseRate));
  return {card,base,bonus:best.eff,reward:r2(base+best.eff),ruleId:best.r.id,ruleName:best.r.name,
    rate:best.r.rate,capLeft:best.capLeft,capped:best.capped,raw:best.raw,reason:parts.join(' · ')};
}
function recommend(ctx){
  const out=[];
  for(const card of S.data.cards){
    const ev=evalCardFor(card,ctx);
    ev.cred=credibilityFor(card.id);
    out.push(ev);
  }
  out.sort((a,b)=>b.reward-a.reward);
  return out;
}
function credibilityFor(cardId){
  /* 回贈校準：以「每月實際入賬 ÷ 當月理論預計」為基礎，實際數據優先於理論計算。
     實際來源 = 逐筆實際 + 手動月結 + 月結單 CR 自動入帳；近期月份加權較重；
     規則改版前的月份減權；樣本少時向理論值（×1.0）收縮，愈多月結單愈準 */
  const card=cardById(cardId);
  const months=new Map();
  const add=(m,e,a)=>{if(!m||m.length<7)return;const o=months.get(m)||{e:0,a:0};o.e+=e||0;o.a+=a||0;months.set(m,o);};
  for(const tx of S.data.transactions){
    if(tx.cardId!==cardId||tx.demo)continue;
    add(tx.date.slice(0,7),tx.expectedReward||0,tx.actualReward||0);
  }
  for(const rm of S.data.rewardMonths){if(rm.cardId===cardId&&!rm.demo)add(rm.month,0,rmTotal(rm));}
  for(const c of S.data.credits||[]){if(c.kind==='rebate'&&c.cardId===cardId&&!c.demo)add(String(c.date||'').slice(0,7),0,c.amount||0);}
  const now=nowMonth(),chg=card&&card.rulesChangedAt?String(card.rulesChangedAt).slice(0,7):null;
  let w=0,s=0,n=0;
  for(const m of [...months.keys()].sort()){
    const o=months.get(m);
    if(o.e<5)continue;                            /* 預計太少，比率不可靠 */
    let a=o.a;
    if(a<=0.01){                                  /* 回贈多於下月才入賬：下月有 CR 而無消費 → 視為本月回贈 */
      const nx=months.get(monthAdd(m,1));
      if(nx&&nx.a>0.01&&nx.e<5)a=nx.a;
    }
    if(a<=0.01)continue;                          /* 月結單未匯入，不作數 */
    const ratio=clamp(a/o.e,0,1.5);
    let wt=Math.pow(0.88,monthsBetween(m,now));   /* 近期月份權重較高 */
    if(chg&&m<chg)wt*=0.4;                        /* 規則改版前的月份減權（舊規則的偏差未必延續） */
    w+=wt;s+=ratio*wt;n++;
  }
  if(!n)return null;
  const raw=w>0?s/w:1,K=2;                        /* 貝葉斯收縮：月數少時向 ×1.0 靠攏 */
  const factor=clamp((w*raw+K)/(w+K),0,1.5);
  return {factor,pct:Math.round(factor*100),n};
}
function actualOfMonth(cardId,month){            /* 某卡某月實際入賬（逐筆＋手動＋CR 自動） */
  let tx=0,rm=0,cr=0;
  for(const t of S.data.transactions){if(t.cardId===cardId&&!t.demo&&t.date.slice(0,7)===month)tx+=t.actualReward||0;}
  for(const r of S.data.rewardMonths){if(r.cardId===cardId&&!r.demo&&r.month===month)rm+=rmTotal(r);}
  for(const c of S.data.credits||[]){if(c.kind==='rebate'&&c.cardId===cardId&&!c.demo&&String(c.date||'').slice(0,7)===month)cr+=c.amount||0;}
  return {tx:r2(tx),rm:r2(rm),cr:r2(cr),total:r2(tx+rm+cr)};
}
/* 月結回贈金額是否明顯不合理：回贈一般反映本月＋上月消費（下月入賬），
   遠超（>4 倍且 >$500）即可能是還款誤計或重複匯入累積 */
function rmImplausible(rm){
  if(!rm||rm.demo)return false;
  let e=0;
  for(const t of S.data.transactions){
    if(t.cardId!==rm.cardId||t.demo)continue;
    const m=t.date.slice(0,7);
    if(m===rm.month||m===monthAdd(rm.month,-1))e+=t.expectedReward||0;
  }
  return (rm.amount||0)>Math.max(e*4,500);
}
/* 里程／積分約等值換算率（手動記錄時可覆寫）：1 里程≈HK$0.06（亞洲萬里通常見估值）、1 積分≈HK$0.004（AEON 250分＝HK$1） */
const MILE_HKD=0.06,PT_HKD=0.004;
/* 月結回贈折合總值＝現金＋里程約值＋積分約值；舊記錄未存約值時按預設率即時計，避免版本升級後數字跳變 */
function rmTotal(rm){
  if(!rm)return 0;
  const mv=rm.miles>0?(rm.milesVal!=null?rm.milesVal:r2(rm.miles*MILE_HKD)):0;
  const pv=rm.points>0?(rm.pointsVal!=null?rm.pointsVal:r2(rm.points*PT_HKD)):0;
  return r2((rm.amount||0)+mv+pv);
}
function guessCategory(desc){
  const l=learnedLabel(desc);
  if(l&&l.category)return l.category;
  const d=String(desc||'').toUpperCase();
  if(!d)return 'other';
  for(const c of S.data.categories){
    for(const k of(c.keywords||[])){
      if(k&&d.includes(String(k).toUpperCase()))return c.id;
    }
  }
  return 'other';
}
function guessOnline(desc){
  const l=learnedLabel(desc);
  if(l&&l.online!=null)return !!l.online;
  const d=String(desc||'').toUpperCase();
  return /ONLINE|ECOM|E-COM|APPLE\.COM|AMAZON|GOOGLE|APP STORE|ITUNES|STRIPE|SHOPIFY|TAOBAO|TMALL|TRIP\.COM|AGODA|BOOKING\.COM|KLOOK|HKTV/.test(d);
}
function addTxFromCtx(ctx,cardId,merchant,opts){
  const card=cardById(cardId);
  if(!card)return null;
  const ev=evalCardFor(card,ctx);
  const tx={id:uid(),date:ctx.date,cardId,merchant:String(merchant||'').trim()||catById(ctx.category).name,

}

/* ============ 加密與雲端同步（MantleDB） ============ */
const MANTLE='https://mantledb.sh/v2';
const SYNC={cfg:null,key:null,busy:false,state:'off',lastPull:0,lastPushAt:0,lastN:0,pushTimer:null,errMsg:''};
const b64=bytes=>{let s='';const CH=String.fromCharCode;for(let i=0;i<bytes.length;i+=0x2000)s+=CH.apply(null,bytes.subarray(i,i+0x2000));return btoa(s);};
const unb64=str=>{const s=atob(str);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;};

function syncCodeOf(cfg){return cfg.ns+':'+cfg.key;}
function parseSyncCode(str){
  const t=String(str||'').trim().replace(/\s+/g,'');
  const i=t.lastIndexOf(':');
  if(i<8||i===t.length-1)return null;
  return {ns:t.slice(0,i),key:t.slice(i+1)};
}
function loadSyncCfg(){
  try{const raw=localStorage.getItem(LS_SYNC);if(raw){const c=JSON.parse(raw);if(c&&c.ns&&c.key)SYNC.cfg=c;SYNC.lastPushAt=c.lastPushAt||0;SYNC.lastN=c.lastN||0;}}catch(e){}
}
function saveSyncCfg(){
  if(!SYNC.cfg){localStorage.removeItem(LS_SYNC);return;}
  localStorage.setItem(LS_SYNC,JSON.stringify({...SYNC.cfg,lastPushAt:SYNC.lastPushAt,lastN:SYNC.lastN}));
}
async function deriveKey(code){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode('micy-shuana/v1/'+code),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:enc.encode('micy-shuana-salt-v1'),iterations:120000,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function gzipStr(str){
  const cs=new CompressionStream('gzip');
  const st=new Blob([str]).stream().pipeThrough(cs);
  return b64(new Uint8Array(await new Response(st).arrayBuffer()));
}
async function gunzipB64(str){
  const ds=new DecompressionStream('gzip');
  const st=new Blob([unb64(str)]).stream().pipeThrough(ds);
  return await new Response(st).text();
}
async function sealDoc(data){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  let plain=JSON.stringify(data),gz=false;
  if(typeof CompressionStream!=='undefined'){
    try{const z=await gzipStr(plain);const rawLen=b64(new TextEncoder().encode(plain)).length;
      if(z.length<rawLen){plain=z;gz=true;}}catch(e){}
  }
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},SYNC.key,new TextEncoder().encode(plain));
  return {iv:b64(iv),data:b64(new Uint8Array(ct)),gz};
}
async function unsealDoc(meta,chunkStr){
  const bytes=unb64(chunkStr);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(meta.iv)},SYNC.key,bytes);
  const dec=new TextDecoder();
  let text=dec.decode(pt);
  if(meta.gz)text=await gunzipB64(text);
  return JSON.parse(text);
}
function api(path,method,body){
  const ctl=new AbortController();
  const to=setTimeout(()=>ctl.abort(),20000);
  return fetch(MANTLE+'/'+SYNC.cfg.ns+'/'+path,{
    method:method||'GET',
    headers:{'Content-Type':'application/json','X-Mantle-Key':SYNC.cfg.key},
    body:body!==undefined?JSON.stringify(body):undefined,
    signal:ctl.signal
  }).finally(()=>clearTimeout(to));
}
async function pushNow(){
  if(!SYNC.cfg||!SYNC.key||SYNC.busy)return false;
  SYNC.busy=true;setSyncState('busy');
  try{
    const sealed=await sealDoc(S.data);
    const parts=[];
    for(let i=0;i<sealed.data.length;i+=48000)parts.push(sealed.data.slice(i,i+48000));
    for(let i=0;i<parts.length;i++){
      const res=await api('c'+i,'POST',{d:parts[i]});
      if(!res.ok)throw new Error('寫入分塊失敗 ('+res.status+')');
    }
    for(let i=parts.length;i<Math.max(SYNC.lastN,parts.length);i++){
      try{await api('c'+i,'DELETE');}catch(e){}
    }
    const res=await api('m','POST',{app:'micy-shuana',v:1,rev:S.data.meta.rev,savedAt:S.data.meta.savedAt,
      n:parts.length,iv:sealed.iv,gz:sealed.gz});
    if(!res.ok)throw new Error('寫入中繼失敗 ('+res.status+')');
    SYNC.lastN=parts.length;SYNC.lastPushAt=Date.now();
    setSyncState('ok');saveSyncCfg();
    return true;
  }catch(e){
    setSyncState('err',e.message||'推送失敗');return false;
  }finally{SYNC.busy=false;}
}
async function pullNow(silent){
  if(!SYNC.cfg||!SYNC.key||SYNC.busy)return;
  SYNC.busy=true;setSyncState('busy');
  try{
    let res=await api('m','GET');
    if(res.status===404){SYNC.busy=false;setSyncState('ok');schedulePush();return;}
    if(!res.ok){
      if(res.status===401)throw new Error('同步碼或金鑰不正確');
      throw new Error('讀取失敗 ('+res.status+')');
    }
    const m=await res.json();
    SYNC.lastPull=Date.now();
    const lr=S.data.meta.rev||0,ls=S.data.meta.savedAt||0;
    if(m.rev===lr&&(m.savedAt||0)===ls){setSyncState('ok');}
    else if(m.rev>lr||(m.rev===lr&&(m.savedAt||0)>ls)){
      const chunks=[];
      for(let i=0;i<(m.n||1);i++){
        const rc=await api('c'+i,'GET');
        if(!rc.ok)throw new Error('下載分塊失敗 ('+rc.status+')');
        chunks.push((await rc.json()).d);
      }
      const data=await unsealDoc(m,chunks.join(''));
      if(!data||data.app!=='micy-shuana')throw new Error('雲端資料格式不正確');
      snapshotLocal('同步覆蓋前備份');
      S.data=data;migrateData();saveLocal();render(true);   /* 雲端覆蓋後同樣套用 v2.7/v2.8 修正，避免舊污染資料復活 */
      toast('已從雲端同步最新資料','ok');
      setSyncState('ok');
    }else{
      schedulePush();
    }
    if(Date.now()-(SYNC.lastPushAt||0)>7*86400000)schedulePush();
  }catch(e){
    setSyncState('err',e.message||'同步失敗');
    if(!silent)toast('同步失敗：'+(e.message||''),'err');
  }finally{SYNC.busy=false;}
}
function schedulePush(delay){
  if(!SYNC.cfg||!SYNC.key)return;
  clearTimeout(SYNC.pushTimer);
  SYNC.pushTimer=setTimeout(pushNow,delay==null?2500:delay);
}
async function createSync(email){
  if(!crypto||!crypto.subtle)throw new Error('此瀏覽器不支援加密，請改用 Safari／Chrome 開啟');
  const ns='micy-shuana-'+rand36(12);
  const q=email?'?email='+encodeURIComponent(email):'';
  const res=await fetch(MANTLE+'/claim/'+ns+q);
  if(!res.ok)throw new Error('建立命名空間失敗 ('+res.status+')');
  const j=await res.json();
  if(!j.key)throw new Error('建立失敗：未取得金鑰');
  SYNC.cfg={ns,key:j.key};
  SYNC.key=await deriveKey(syncCodeOf(SYNC.cfg));
  saveSyncCfg();
  await pushNow();
  return syncCodeOf(SYNC.cfg);
}
async function enterSync(code){
  if(!crypto||!crypto.subtle)throw new Error('此瀏覽器不支援加密，請改用 Safari／Chrome 開啟');
  const cfg=parseSyncCode(code);
  if(!cfg)throw new Error('同步碼格式不正確');
  SYNC.cfg=cfg;
  SYNC.key=await deriveKey(code);
  let m=null;
  const res=await api('m','GET');
  if(res.status===404){
    if(!S.data.cards.length&&!S.data.transactions.length){
      SYNC.cfg=null;SYNC.key=null;
      throw new Error('此同步碼雲端未有資料，請確認後重試');
    }
    saveSyncCfg();await pushNow();return {tookOver:true};
  }
  if(!res.ok){
    SYNC.cfg=null;SYNC.key=null;
    throw new Error(res.status===401?'同步碼不正確':'連線失敗 ('+res.status+')');
  }
  m=await res.json();
  const chunks=[];
  for(let i=0;i<(m.n||1);i++){
    const rc=await api('c'+i,'GET');
    if(!rc.ok)throw new Error('下載分塊失敗');
    chunks.push((await rc.json()).d);
  }
  const data=await unsealDoc(m,chunks.join(''));
  if(!data||data.app!=='micy-shuana')throw new Error('雲端資料格式不正確');
  saveSyncCfg();
  if(S.data.cards.length||S.data.transactions.length){
    snapshotLocal('登入同步前本機備份');
  }
  S.data=data;migrateData();saveLocal();   /* 登入採用雲端資料後同樣套用修正 */
  S.data.settings.ready=true;
  S.data.meta.rev=Math.max(S.data.meta.rev||0,0);
  saveLocal();render(true);
  return {adopted:true};
}
function disconnectSync(){
  SYNC.cfg=null;SYNC.key=null;SYNC.state='off';
  localStorage.removeItem(LS_SYNC);
  toast('已中斷雲端同步（本機資料保留）');
  render(true);
}

/* ============ 語句匯入（CSV） ============ */
const IMP={text:'',rows:[],headers:[],map:{date:-1,desc:-1,amount:-1,debit:-1,credit:-1},cardId:'',autoMapDone:false,flip:false};
function impParse(text){
  IMP.text=text||'';
  IMP.rows=[];IMP.headers=[];IMP.autoMapDone=false;
  IMP.map={date:-1,desc:-1,amount:-1,debit:-1,credit:-1};
  const rows=parseCSV(IMP.text);
  if(!rows.length)return 0;
  if(looksLikeHeader(rows[0])){IMP.headers=rows[0];IMP.rows=rows.slice(1);}
  else{IMP.headers=rows[0].map((_,i)=>'欄 '+(i+1));IMP.rows=rows;}
  const find=re=>{for(let i=0;i<IMP.headers.length;i++){if(re.test(IMP.headers[i]))return i;}return -1;};
  IMP.map.date=find(/日期|date/i);
  IMP.map.desc=find(/描述|desc|details|remarks|transaction|商戶|說明|摘要/i);
  IMP.map.amount=find(/金額|amount|amt/i);
  IMP.map.debit=find(/支賬|debit|支出/i);
  IMP.map.credit=find(/存賬|credit|入賬/i);
  if(IMP.map.amount>=0&&/外幣|foreign/i.test(IMP.headers[IMP.map.amount])){
    const alt=find(/(hkd|港幣)/i);if(alt>=0)IMP.map.amount=alt;
  }
  if(IMP.map.desc<0)IMP.map.desc=IMP.headers.length-1;
  impDetectSign();
  return IMP.rows.length;
}
function impDetectSign(){
  IMP.flip=false;
  if(IMP.map.amount<0||IMP.map.debit>=0||IMP.map.credit>=0)return;
  let pos=0,neg=0;
  for(const row of IMP.rows){
    const v=parseMoney(row[IMP.map.amount]);
    if(v==null||v===0)continue;
    if(v>0)pos++;else neg++;
  }
  if(neg>pos)IMP.flip=true;
}
function impRowAmount(row){
  const m=IMP.map;
  if(m.debit>=0||m.credit>=0){
    const d=m.debit>=0?parseMoney(row[m.debit]):null;
    if(d!=null&&Math.abs(d)>0)return Math.abs(d);
    const c=m.credit>=0?parseMoney(row[m.credit]):null;
    if(c!=null&&Math.abs(c)>0)return null;
  }
  if(m.amount>=0){
    const v=parseMoney(row[m.amount]);
    if(v==null)return null;
    const spend=IMP.flip?-v:v;
    return spend>0?spend:null;
  }
  return null;
}
function impBuildTx(row,cardId){
  const date=IMP.map.date>=0?parseDateAny(row[IMP.map.date]):null;
  const amount=impRowAmount(row);
  if(!date||amount==null||amount<=0)return null;
  const desc=IMP.map.desc>=0?String(row[IMP.map.desc]||''):'';
  const ctx={date,amount,online:guessOnline(desc),category:guessCategory(desc)};
  const tx=addTxFromCtx(ctx,cardId,desc);
  return tx;
}
function impRun(cardId){
  let ok=0,skip=0;
  for(const row of IMP.rows){
    if(impBuildTx(row,cardId))ok++;else skip++;
  }
  return {ok,skip};
}

  }).join('');
  if(!rateList){
    rateList=`<div class="cset-row"><div class="cr"><div class="ct">一般回贈</div>
    <div class="cs">尚未設定各類別額外回贈，可到下方「新增規則」</div></div>
    <div class="cv"><span class="cset-rate">${+((base)*100).toFixed(2)}%</span></div></div>`;

    const valid=[r.start?r.start+' 起':'',r.end?'至 '+r.end:''].filter(Boolean).join(' ');
    const verTag=(r.end&&SYNC_RULE_ID.test(String(r.id)))?' · 歷史版本':'';
    return `<div class="cset-row" data-action="rule-edit" data-id="${cardId}|${r.id}">
    <div class="cr"><div class="ct">${esc(r.name||'規則')}</div>
    <div class="cs">${cat.emoji} ${esc(cat.name)} · 額外 ${fmtPct(r.rate)}${r.capMonth?' · 每月上限 '+fmtHKD(r.capMonth):''}${r.online===true?' · 只限網上':r.online===false?' · 只限門市':''}${valid?' · '+valid:''}${verTag}</div></div>
    ${r.online===true?'<span class="cset-tag">網上</span>':''}<span class="caret">›</span></div>`;
  }).join('');
  return `<div class="cset">
  ${card?cardFaceImg(card):''}
  ${card&&card.demo?`<div class="cset-gcap" style="color:#C098E3;display:flex;align-items:center;gap:6px">⚠ 示例卡片 · 規則僅供參考，請改為真實條款</div>`:''}

  <div class="cset-group">
    <div class="cset-row"><div class="cl">卡片名稱</div><div class="cv"><input class="cset-input" id="k-name" placeholder="例如 HSBC Red" value="${esc(card?card.name:'')}"></div></div>
    <div class="cset-row"><div class="cl">發卡銀行</div><div class="cv"><input class="cset-input" id="k-bank" placeholder="例如 滙豐" value="${esc(card?card.bank||'':'')}"></div></div>
    <div class="cset-row"><div class="cl">基本回贈</div><div class="cv"><input class="cset-input" id="k-base" type="number" step="0.01" min="0" value="${card?String(+(card.baseRate*100).toFixed(2)):''}" placeholder="0.4" style="max-width:120px"><span style="font-size:13px;color:#8A8598">%</span></div></div>
    <div class="cset-row"><div class="cl">標記顏色</div><div class="cv"><input type="color" id="k-color" value="${card?card.color||'#6C5CE7':'#6C5CE7'}" style="width:60px;height:34px;padding:2px;border:1.5px solid #E4E2EC;border-radius:8px;background:none"></div></div>
  </div>
  <div class="cset-gcap">各類別回贈率</div>
  <div class="cset-group">${rateList}</div>
  ${card?`<div class="cset-gcap">回贈規則</div>
  <div class="cset-group">${ruleRows||''}
    <div class="cset-add" data-action="rule-add" data-id="${cardId}"><span class="plus">＋</span>新增規則</div></div>`:''}
  <div class="cset-cta">${card?`<button class="btn btn-danger" data-action="card-del" data-id="${cardId}">刪除卡片</button>`:''}
  <button class="btn btn-primary" data-action="card-save" data-id="${cardId||''}">${card?'儲存卡片':'新增卡片'}</button></div>
  </div>`;
}

function tabsHTML(tab){

function recordsHTML(){
  const m=UI.recMonth;
  const cardOpts='<option value="all">全部卡片</option>'+S.data.cards.map(c=>`<option value="${c.id}" ${UI.recCard===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
  const catOpts='<option value="all">全部分類</option>'+S.data.categories.map(c=>`<option value="${c.id}" ${UI.recCat===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
  if(UI.recTab==='rm'){
    const rms=S.data.rewardMonths.filter(r=>r.month===m&&(UI.recCard==='all'||r.cardId===UI.recCard));
    const rows=rms.map(rm=>{
      const card=cardById(rm.cardId);
      const warn=rmImplausible(rm)?' <span class="b" style="background:#c2410c;color:#fff">⚠ 金額異常</span>':'';
      const pdfBtn=rm.sid?`<button class="pdf-btn" data-action="pdf-view" data-kind="rm" data-id="${rm.id}" title="跳回月結單原件，高亮此筆對賬">📄</button>`:'';
      /* 里程／積分帶約等值港幣：3,500 里 ≈HK$210 · 25,000 分 ≈HK$100（舊記錄未存約值時按預設率即時計） */
      const mi=rm.miles>0?Number(rm.miles).toLocaleString('en-HK')+' 里≈'+fmtHKD(rm.milesVal!=null?rm.milesVal:r2(rm.miles*MILE_HKD)):'';
      const po=rm.points>0?Number(rm.points).toLocaleString('en-HK')+' 分≈'+fmtHKD(rm.pointsVal!=null?rm.pointsVal:r2(rm.points*PT_HKD)):'';
      const extra=(mi||po)?`<small class="amt-dim">${[mi,po].filter(Boolean).join(' · ')}</small>`:'';
      return `<div class="row" data-action="rm-edit" data-id="${rm.id}">
      <div class="row-ico">💰</div>
      <div class="row-main"><div class="row-t1">${esc(card?card.name:'已刪卡片')} ${rm.demo?'<span class="b b-demo">示例</span>':''}${warn}</div>
      <div class="row-t2">${monthLabel(rm.month)} 實際入賬${rm.note?' · '+esc(rm.note):''}${pdfBtn}</div></div>
      <div class="row-amt amt-good">${fmtHKD(rm.amount)}${extra}</div></div>`;
    }).join('');
    const anyWarn=rms.some(rm=>rmImplausible(rm));
    /* 回贈/還款置頂：信用卡還款、退款、舊版回贈，讓「回贈月結」即便尚無月結回贈也有內容 */
    const creds=(S.data.credits||[]).filter(c=>!c.demo)
      .filter(c=>String(c.date||'').slice(0,7)===m&&(UI.recCard==='all'||c.cardId===UI.recCard))
      .sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||String(b.id).localeCompare(String(a.id)));
    const credRows=creds.map(c=>{
      const card=cardById(c.cardId),kd=KINDS[c.kind]||KINDS.tx;
      const pdfBtn=c.sid?`<button class="pdf-btn" data-action="pdf-view" data-kind="cred" data-id="${c.id}" title="跳回月結單原件，高亮此筆對賬">📄</button>`:'';
      return `<div class="kv"><div><span style="font-size:11px;color:#fff;background:${kd.bg};border-radius:7px;padding:1px 7px">${kd.n}</span>
      <b>${fmtHKD(c.amount)}</b><br><span class="mini">${fmtDateFull(c.date)} · ${esc(c.merchant)}${card?' · '+esc(card.name):''}${pdfBtn}</span></div>
      <button class="btn btn-sm btn-ghost" data-action="cred-del" data-id="${c.id}">刪除</button></div>`;
    }).join('');
    return `${tabsHTML('rm')}
    ${monNavHTML('rec')}
    <section class="panel"><h2 class="p-title">回贈/還款</h2>
    ${credRows||'<div class="mini">本月無回贈／還款／退款入賬記錄。</div>'}
    <button class="btn btn-ghost btn-block" style="margin-top:10px" data-action="cred-open">查看全部回贈/還款</button></section>
    <section class="panel" style="margin-bottom:2px"><button class="btn btn-primary btn-block" data-action="rm-add">新增月結回贈</button></section>
    <section class="panel"><h2 class="p-title">月結回贈</h2>
    ${anyWarn?'<div class="mini" style="color:#c2410c;margin-bottom:6px">⚠ 有金額遠高於當月預計回贈，可能誤把還款或重複匯入計入；點擊該筆可修正金額。</div>':''}
    ${rows||'<div class="mini">本月未有月結回贈記錄<br>銀行月結單出咗之後，在這裡記錄實際入賬——現金、里程、積分都得</div>'}</section>`;
  }
  const txs=txsOfMonth(m).filter(t=>(UI.recCard==='all'||t.cardId===UI.recCard)&&(UI.recCat==='all'||t.category===UI.recCat))
    .sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  const spend=txs.reduce((s,t)=>s+t.amount,0);
  const exp=txs.reduce((s,t)=>s+(t.expectedReward||0),0);
  const act=txs.reduce((s,t)=>s+(t.actualReward||0),0);
  const calByCard=new Map();
  for(const t of txs){if(!calByCard.has(t.cardId))calByCard.set(t.cardId,credibilityFor(t.cardId));}
  let calExp=0,anyCal=false;
  for(const t of txs){const c=calByCard.get(t.cardId);if(c&&c.factor>0){calExp+=(t.expectedReward||0)*c.factor;anyCal=true;}else calExp+=t.expectedReward||0;}
  calExp=r2(calExp);
  const rows=txs.map(t=>{
    const card=cardById(t.cardId),cat=catById(t.category),hasAct=t.actualReward!=null;
    const c=calByCard.get(t.cardId),cAmt=(c&&c.factor>0)?(t.expectedReward||0)*c.factor:null;
    const pdfBtn=t.sid?`<button class="pdf-btn" data-action="pdf-view" data-kind="tx" data-id="${t.id}" title="跳回月結單原件，高亮此筆對賬">📄</button>`:'';
    return `<div class="row" data-action="tx-edit" data-id="${t.id}">
    <div class="row-ico">${cat.emoji}</div>
    <div class="row-main"><div class="row-t1">${esc(t.merchant)}</div>
    <div class="row-t2">${fmtDateFull(t.date)} · ${esc(card?card.name:'已刪卡片')}${t.online?' · 網上':''}${t.demo?' <span class="b b-demo">示例</span>':''}${t.ruleName?' · '+esc(t.ruleName):''}${pdfBtn}</div></div>
    <div class="row-amt amt-bad">${fmtHKD(t.amount)}<small class="amt-dim">${hasAct?'實際 '+fmtHKD(t.actualReward):(cAmt!=null?'校準 '+fmtHKD(cAmt)+' · 理論 '+fmtHKD(t.expectedReward):'預計 '+fmtHKD(t.expectedReward))}</small></div></div>`;
  }).join('');
  return `<section class="panel" style="display:flex;gap:10px">
  <button class="btn btn-primary" style="flex:1.8" data-action="pdft-open">匯入月結單 PDF</button>
  <button class="btn btn-ghost" style="flex:1" data-action="tx-add">新增消費</button></section>
  ${tabsHTML('tx')}${monNavHTML('rec')}
  <div class="stat-strip">
  <div class="stat"><div class="sv">${fmtHKD(spend)}</div><div class="sl">總消費</div></div>
  <div class="stat s-est"><div class="sv">${fmtHKD(anyCal?calExp:exp)}</div><div class="sl">${anyCal?'預計回贈·校準':'預計回贈'}</div></div>
  <div class="stat s-act"><div class="sv">${fmtHKD(act)}</div><div class="sl">實際回贈</div></div></div>
  <div class="fbar"><select id="f-card" data-change="rec-filter">${cardOpts}</select><select id="f-cat" data-change="rec-filter">${catOpts}</select></div>
  ${rows||'<div class="empty">本月未有記錄<br>可匯入銀行語句（CSV）或手動新增</div>'}
  <section class="panel" style="display:flex;gap:10px">
  <button class="btn btn-ghost" style="flex:1" data-action="import-open">匯入語句（CSV）</button>
  <button class="btn btn-ghost" style="flex:1" data-action="cred-open">回贈／還款</button>
  <button class="btn btn-ghost" style="flex:1" data-action="pdf-lib">📄 PDF 對賬</button></section>`;
}

/* ---- 分析 ---- */
function analysisHTML(){
  const m=UI.anMonth;
  const txs=txsOfMonth(m);
  const rms=S.data.rewardMonths.filter(r=>r.month===m);
  if(!txs.length&&!rms.length){
    const hasDemo=S.data.transactions.some(t=>t.demo);
    return `${monNavHTML('an')}<div class="empty">本月未有數據${!hasDemo?'<br><br><button class="btn btn-primary btn-sm" data-action="demo-load">載入示例資料睇效果</button>':''}</div>`;
  }
  const byCard=new Map();
  for(const t of txs){const c=byCard.get(t.cardId)||{spend:0,exp:0,act:0};c.spend+=t.amount;c.exp+=t.expectedReward||0;byCard.set(t.cardId,c);}
  for(const rm of rms){const c=byCard.get(rm.cardId)||{spend:0,exp:0,act:0};c.act+=rmTotal(rm);byCard.set(rm.cardId,c);}
  for(const c of S.data.credits||[]){if(c.kind==='rebate'&&String(c.date||'').slice(0,7)===m){const o=byCard.get(c.cardId)||{spend:0,exp:0,act:0};o.act+=c.amount||0;byCard.set(c.cardId,o);}}
  const perf=[...byCard.entries()].map(([id,c])=>({card:cardById(id),...c,cred:credibilityFor(id)})).sort((a,b)=>b.spend-a.spend);
  const perfRows=perf.map(p=>{
    const calExp=p.cred&&p.cred.factor>0?p.exp*p.cred.factor:p.exp;
    const diff=r2(p.act-calExp);
    const isGood=diff>=0;
    const src=actualOfMonth(p.card?p.card.id:'_',m);
    const srcTxt=[src.cr>0?'月結單CR '+fmtHKD(src.cr):'',src.rm>0?'手動月結 '+fmtHKD(src.rm):'',src.tx>0?'逐筆 '+fmtHKD(src.tx):''].filter(Boolean).join('＋')||'暫無實際數據';
    const calPct=p.cred&&p.cred.factor>0?('×'+p.cred.pct+'%'):'—';
    const nTxt=p.cred&&p.cred.n?('（'+p.cred.n+' 個月）'):'（尚無歷史）';
    return `<div class="perf-card">
    <div class="perf-head">
    <span class="perf-dot" style="background:${p.card?p.card.color||'#6C5CE7':'#999'}"></span>
    <span class="perf-name">${esc(p.card?p.card.name:'已刪卡片')}</span>
    <span class="perf-diff ${isGood?'good':'bad'}">${isGood?'+':''}${fmtHKD(diff)}</span></div>
    <div class="perf-grid">
    <div class="perf-cell"><div class="perf-k">消費</div><div class="perf-v">${fmtHKD(p.spend)}</div></div>
    <div class="perf-cell"><div class="perf-k">理論回贈</div><div class="perf-v">${fmtHKD(p.exp)}</div></div>
    <div class="perf-cell"><div class="perf-k">校準係數</div><div class="perf-v">${calPct}</div></div></div>
    <div class="perf-foot">
    <span class="pf">校準 <b>${fmtHKD(calExp)}</b></span>
    <span class="pf">實際 <b class="${isGood?'good':'bad'}">${fmtHKD(p.act)}</b></span></div>
    <div class="perf-src">差異 ${isGood?'+':'−'}${fmtHKD(Math.abs(diff))} · 來源 ${srcTxt} ${nTxt}</div></div>`;
  }).join('');
  const byCat={};
  for(const t of txs)byCat[t.category]=(byCat[t.category]||0)+t.amount;
  const catArr=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,7);
  const maxCat=Math.max(1,...catArr.map(x=>x[1]));
  const catBars=catArr.map(([id,v])=>{
    const c=catById(id);
    return `<div class="bar-row"><div class="bar-lbl"><span>${c.emoji} ${esc(c.name)}</span><span class="bv">${fmtHKD(v)}</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${(v/maxCat*100).toFixed(1)}%"></div></div></div>`;
  }).join('');
  const months=[];for(let i=5;i>=0;i--)months.push(monthAdd(m,-i));
  const stats=months.map(mm=>{let e=0,a=0;
    for(const t of txsOfMonth(mm)){e+=t.expectedReward||0;a+=t.actualReward||0;}
    for(const r of S.data.rewardMonths){if(r.month===mm&&!r.demo)a+=rmTotal(r);}
    for(const c of S.data.credits||[]){if(c.kind==='rebate'&&!c.demo&&String(c.date||'').slice(0,7)===mm)a+=c.amount||0;}
    return {mm,e,a};});
  const maxT=Math.max(1,...stats.map(s=>Math.max(s.e,s.a)));
  const trend=stats.map(s=>`<div class="bar-row"><div class="bar-lbl"><span>${monthLabel(s.mm).slice(5)}</span>
  <span class="bv">預計 ${fmtHKD(s.e)} · 實際 ${fmtHKD(s.a)}</span></div>
  <div class="dual"><div class="bar-fill" style="width:${(s.e/maxT*100).toFixed(1)}%"></div><div class="bar-fill g" style="width:${(s.a/maxT*100).toFixed(1)}%"></div></div></div>`).join('');
  const diffs=txs.filter(t=>t.actualReward!=null&&Math.abs((t.actualReward||0)-(t.expectedReward||0))>=1)
    .sort((a,b)=>Math.abs(b.actualReward-b.expectedReward)-Math.abs(a.actualReward-a.expectedReward));
  const diffRows=diffs.map(t=>{
    const d=(t.actualReward||0)-(t.expectedReward||0);
    return `<div class="row" data-action="tx-edit" data-id="${t.id}">
    <div class="row-ico">${catById(t.category).emoji}</div>
    <div class="row-main"><div class="row-t1">${esc(t.merchant)}</div>
    <div class="row-t2">${fmtDateFull(t.date)} · 預計 ${fmtHKD(t.expectedReward)}</div></div>
    <div class="row-amt ${d>=0?'amt-good':'amt-bad'}">${fmtHKD(t.actualReward)}<small>${d>=0?'+':'−'}${fmtHKD(Math.abs(d))}</small></div></div>`;
  }).join('');
  return `${monNavHTML('an')}
  <section class="panel"><h2 class="p-title">卡片表現</h2>
  <p class="p-sub">差異以「校準預計」為基準（實際 − 校準預計）。校準係數 = 該卡歷史每月「實際入賬 ÷ 當時規則預計」加權平均，實際數據優先於官方理論；匯入愈多月結單，估算愈準。</p>
  <p class="p-sub">實際入賬來源：月結單 CR 自動辨認＋手動月結＋逐筆填寫。回贈一般遲一個月入賬屬正常。</p>${perfRows||'<div class="mini">未有數據</div>'}</section>
  <section class="panel"><h2 class="p-title">分類消費</h2>${catBars||'<div class="mini">未有數據</div>'}</section>
  <section class="panel"><h2 class="p-title">近 6 個月回贈走勢</h2>
  <p class="p-sub">預計按消費當時有效的規則測算（規則變更不追溯舊帳單）；實際按入賬月份計。</p>${trend}</section>
  ${diffRows?`<div class="alt-head">差異明細（實際 − 預計 ≥ HK$1）</div>${diffRows}`:''}`;
}

const PAY_DESC=/AUTO ?PAY|自動轉帳|自動轉賬|自動扣數|繳款|應繳|還款|已還|PAYMENT|PAY ?24|PAYME|THANK|DIRECT ?DEBIT|REPAY|轉帳還款|轉賬還款|全數償還/i;

function incType(desc){

function stmtMeta(text){

  else if(/STANDARD CHARTERED|渣打|CATHAY|國泰/.test(U))bank='sc';
  else if(/HSBC PULSE|PULSE UNIONPAY|PULSE DUALCURRENCY|HSBC UNIONPAY/.test(U))bank='hsbc';
  else if(/MOX CREDIT|\bMOX\b|Mox Credit/.test(U))bank='mox';
  else if(/AEON|WAKUWAKU|AEON VISA/.test(U))bank='aeon';
  let year=new Date().getFullYear(),mon=new Date().getMonth()+1;
  if(bank==='boc'||bank==='hsbc'||bank==='mox'||bank==='aeon'){
    /* BOC / HSBC / AEON：先找「結單日期」標籤（Chill 卡與標籤同行；GO 卡日期在標籤下一行；
       AEON 為 "Statement Date 結單日期: 12 Jul 2026"），再找 "Statement Date"，
       最後退回全文首個 19-JUL-2026（連字）或 17 JUL 2026（空格）日期，避免誤用當前月份 */
    if(bank==='boc'||bank==='hsbc'||bank==='aeon'){
      let m=/結單日期[\s\S]{0,90}?(\d{1,2})[-\s]+([A-Za-z]{3})[-\s]+(\d{4})/i.exec(U);
      if(!m||!monNum(m[2]))m=/Statement ?Date[\s\S]{0,90}?(\d{1,2})[-\s]+([A-Za-z]{3})[-\s]+(\d{4})/i.exec(U);
      if(m&&monNum(m[2])){year=+m[3];mon=monNum(m[2]);}
      else{
        const d=/\b(\d{1,2})-([A-Za-z]{3})-(\d{4})\b/.exec(U);
        if(d&&monNum(d[2])){year=+d[3];mon=monNum(d[2]);}
        else{const s=/\b(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})\b/i.exec(U);if(s&&monNum(s[2])){year=+s[3];mon=monNum(s[2]);}}
      }
    }
    // Mox: statement period "10 Jun 2026 - 9 Jul 2026" -> use period end
    else if(bank==='mox'){
      const p=/(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})\s*-\s*(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})/i.exec(U);
      if(p&&monNum(p[5])){year=+p[6];mon=monNum(p[5]);}
      else{const m=/\b(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})\b/i.exec(U);if(m&&monNum(m[2])){year=+m[3];mon=monNum(m[2]);}}
    }
  }
  else{
    const bm=/Statement Date[^0-9]{0,45}?(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(U);
    if(bm&&+bm[1]>0&&+bm[1]<=31&&+bm[2]>0&&+bm[2]<=12){year=+bm[3];mon=+bm[2];}
    else{const m2=/\b(\d{1,2})-([A-Za-z]{3})-(\d{4})\b/.exec(U);if(m2){const mo=monNum(m2[2]);if(mo){year=+m2[3];mon=mo;}}}
  }
  return {bank,year,mon};
}
function parseBOC(text,year,stmtMon){
  const rows=[],lines=text.split(/\r?\n/);
  const txn=/^(\d{1,2})-([A-Za-z]{3})\s+(\d{1,2})-([A-Za-z]{3})\s+(.*?)\s+([\d,]+(?:\.\d{1,2})?)\s*(CR)?\s*$/i;
  for(const raw of lines){
    const s=String(raw).replace(/\s+/g,' ').trim();
    if(!s||/BALANCE B\/F|CURRENT BALANCE|ODD CENTS|LAST ITEM|^\d{4}-\d{4}/i.test(s))continue;
    const mm=txn.exec(s);if(!mm)continue;
    const trD=+mm[3],trM=monNum(mm[4]);
    if(!trD||trM==null)continue;
    const trY=(trM>stmtMon?year-1:year);
    const date=ymd(trD,trM,trY);if(!date)continue;
    const desc=(mm[5]||'').trim(),amount=num(mm[6]),cr=!!mm[7];
    if(/=\s*$/.test(desc))continue; /* 積分回贈行（如 GP Rebate ...= 1314）非港幣金額 */
    let kind='tx';
    if(cr){ /* 所有帶 CR 的都是收入：還款優先、其次回贈、其餘退款 */
      kind=incType(desc);
    }
    else if(/REBATE|CASH ?REBATE|CASHBACK|回贈/i.test(desc)){ /* 現金回贈（未標 CR 亦為收入） */
      kind='rebate';
    }
    rows.push({date,amount,merchant:cleanMerch(desc),online:guessOnline(desc),category:guessCategory(desc),kind});
  }
  return rows;
}
function parseSC(text,year,stmtMon){
  const lines=text.split(/\r?\n/),buys=[],refs=[];
  const amtRx=/^(\d{2})\/(\d{2})\s+([\d,]+(?:\.\d{1,2})?)\s*(CR)?\s*$/;
  const refRx=/Transaction Ref\s+(\d+)\s+(.+?)\s*$/i;
  for(const raw of lines){
    const s=String(raw).trim();
    const a=amtRx.exec(s);
    if(a){const mo=+a[1],dd=+a[2];if(mo<1||mo>12||dd<1||dd>31)continue;
      const y=(mo>stmtMon?year-1:year);const date=ymd(dd,mo,y);if(!date)continue;
      buys.push({date,amount:num(a[3]),kind:a[4]?'payment':'tx'});continue;}

}
/* Mox Credit：Activity date(DD Mon) Settlement(DD Mon) 詳情 -金額(HKD)（負=消費、正=還款/回贈）*/
function parseMOX(text,year,stmtMon){
  const lines=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const DATE=/^(\d{1,2})\s+([A-Za-z]{3})\s+(\d{1,2})\s+([A-Za-z]{3})\s+([\s\S]*?)\s*(-?[\d,]+\.\d\d)\s*$/i;
  const isDate=l=>/^\d{1,2}\s+[A-Za-z]{3}\s+\d{1,2}\s+[A-Za-z]{3}\b/i.test(l);
  const out=[];
  for(let i=0;i<lines.length;i++){
    const s=lines[i]; if(!isDate(s))continue;
    const mm=DATE.exec(s); if(!mm)continue;
    const aD=+mm[1],aM=monNum(mm[2]);
    const trY=(aM>stmtMon?year-1:year);
    const date=ymd(aD,aM,trY); if(!date)continue;
    let desc=(mm[5]||'').trim(), amount=num(mm[6]);
    if(!desc){ /* 交易說明可能被拆到相鄰行 */
      for(const cand of [lines[i+1],lines[i-1]]){
        if(!cand||isDate(cand)||!cand.trim())continue;
        desc=cand.trim(); break;
      }
    }
    desc=cleanMerch(desc);
    let kind='tx';
    if(amount>0){ kind=incType(desc); if(kind==='credit')kind='payment'; amount=Math.abs(amount); } /* Mox 正數=還款/回贈，一律視收款 */
    else amount=Math.abs(amount);
    out.push({date,amount,merchant:desc,online:guessOnline(desc),category:guessCategory(desc),kind});
  }
  return out;
}
/* HSBC Pulse 雙幣卡：Post date Trans date 詳情 地區 金額(CR)（CNY 子帳戶行尾為 CHN CN）*/
function parseHSBC(text,year,stmtMon){
  const lines=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const TXN=/^(\d{1,2})([A-Z]{3})\s+(\d{1,2})([A-Z]{3})\s+(.+?)\s+([\d,]+\.\d\d)(CR)?\s*$/i;
  const out=[];let cc='';
  for(const raw of lines){
    const s=String(raw);
    const am=/Amount\s*\((HKD|CNY)\)/i.exec(s); if(am){cc=am[1].toUpperCase();continue;}
    const sub=/\b(RMB|HKD|CNY)\s*Sub-account/i.exec(s); if(sub){cc=sub[1]==='RMB'?'CNY':sub[1].toUpperCase();continue;}
    const mm=TXN.exec(s); if(!mm)continue;
    let cur=cc;
    const pair=/\b(CHN|CHINA)\s+(CN)\b$/.test(mm[5])?'CNY':(/\b(HKG|HONG ?KONG)\s+(HK)\b$/.test(mm[5])?'HKD':null);
    if(pair)cur=pair;
    const pd=+mm[1],pm=monNum(mm[2]);
    const trY=(pm>stmtMon?year-1:year);
    const date=ymd(pd,pm,trY); if(!date)continue;
    let desc=String(mm[5]||'').trim();
    desc=desc.replace(/\s+(HKG|HONG ?KONG)\s+(HK)\s*$/i,'').replace(/\s+(CHN|CHINA)\s+(CN)\s*$/i,'')
      .replace(/\s+(HKG|HK|CHN|CN|CHINA|HONG ?KONG|SGP|TWN|MO|MOC|JPN|KOR|THA|USA|US)\s*$/gi,'').trim();
    const amount=num(mm[6]),cr=!!mm[7];
    let kind=cr?incType(desc):'tx'; /* 還款/自動轉賬優先，其次回贈 */
    out.push({date,amount,merchant:desc,online:guessOnline(desc),category:guessCategory(desc),kind,cur:cur||'HKD'});

/* AEON 綜合月結單（多張卡分頁）：Transaction Date Post Date 詳情 地區 支付方式 金額(CR)

   依標題行把該頁交易對應到正確的 AEON 卡，無需人手逐筆改卡 */
function parseAEON(text,year,stmtMon){
  const lines=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const TXN=/^(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})\s+(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})\s+(.+?)\s+([\d,]+\.\d\d)\s*(CR)?\s*$/i;

  const aeonCardOf=header=>{
    const cards=aeonCards();if(!cards.length)return null;
    const H=String(header||'').toUpperCase();

    if(/WAKUWAKU/.test(H))return (by(/WAKU/)||cards[0]).id;
    if(/PURPLE|VISA CREDIT CARD/.test(H))return (by(/PURPLE/)||by(/VISA/)||cards[0]).id;

    for(let k=i-1;k>=0;k--){
      const p=String(lines[k]||'').trim();if(!p)continue;
      if(DATED.test(p)||TXN.test(p))break;
      if(/^(YOUR CARD ACTIVITIES|CARD ACTIVITIES)$/i.test(p))break;
      if(/^AEON\b/i.test(p)&&/CARD|VISA|CREDIT|WAKU/i.test(p))break;
      if(/PREVIOUS BALANCE|STATEMENT BALANCE|MINIMUM PAYMENT|CREDIT CARD LIMIT|NOTE|備註|REMARK|FINANCE CHARGE|購物簽賬|現金預支|OPENING BALANCE|CLOSING BALANCE/i.test(p))break;

    if(/^AEON\b/i.test(s)&&/CARD|VISA|CREDIT|WAKU/i.test(s)){const cid=aeonCardOf(s);if(cid)cur=cid;continue;} /* 分頁卡標題 */
    const m=TXN.exec(s)||DATED.exec(s); if(!m)continue;
    const date=ymd(+m[1],monNum(m[2]),+m[3]); if(!date)continue;
    let desc='',amount=0,cr=false;
    if(DATED.test(s)){            /* 金額行缺商家：商家在上一行（Taobao 多列交易） */

      amount=num(d[7]); cr=!!d[8]; desc=prevDesc(i);

    }
    let kind='tx';
    if(cr){ kind=incType(desc); if(kind==='credit'&&/REFUND|退款|退貨|OFFSET/i.test(desc))kind='credit'; else if(kind==='credit')kind='payment'; }
    /* AEON 收款：還款優先、退款→credit、回贈→rebate、其他收款視為還款 */
    out.push({date,amount,merchant:desc,online:guessOnline(desc),category:guessCategory(desc),kind,cardId:cur||undefined});
  }
  /* 頁尾獎賞計劃 → 折算現金記入回贈：AEON 積分（一般 25000 分 ≈ HK$100 Circle K 消費券 → 1 分 = HK$0.004，
     歸 Purple/Visa 卡）；WAKU COIN（1 coin = HK$1，歸 Wakuwaku 卡）。入賬日用月結單結單日 */
  const sd=/Statement ?Date[\s\S]{0,90}?(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})/i.exec(text)||/結單日期[\s\S]{0,90}?(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})/i.exec(text);
  const rewDate=(sd&&monNum(sd[2]))?ymd(+sd[1],monNum(sd[2]),+sd[3]):ymd(1,stmtMon,year);

      if(m&&+m[1]>0){const pts=+m[1].replace(/,/g,'');

        out.push({date:rewDate,amount:r2(pts*0.004),merchant:'AEON 積分獎賞 '+pts+' 分',online:null,category:'other',kind:'rebate',cardId:cid||undefined});}
    }else if(/WAKU COIN Reward Program|WAKU COIN ?獎賞計劃/i.test(s)){
      const m=numLine(i+1);
      if(m&&+m[1]>0){const cn=+m[1].replace(/,/g,'');
        const cid=(aeonCards().find(c=>/WAKU/i.test(c.name))||{}).id;
        out.push({date:rewDate,amount:r2(cn),merchant:'WAKU COIN 獎賞 '+cn+' coin',online:null,category:'other',kind:'rebate',cardId:cid||undefined});}
    }
  }
  return out;
}
function guessCard(text){

  if(/PULSE|HSBC UNIONPAY/i.test(U))tags.push('PULSE');
  if(/HSBC|滙豐|RED|RC/i.test(U))tags.push('RED','HSBC');
  if(/MOX|\bMOX\b/i.test(U))tags.push('MOX');
  if(/WAKUWAKU/i.test(U))tags.push('WAKUWAKU');
  if(/PURPLE|AEON/i.test(U)&&/VISA/i.test(U))tags.push('AEON','PURPLE');
  if(/AEON/i.test(U))tags.push('AEON');
  const want=BANKNAME[bank];
  for(const t of tags){
    for(const c of cards){if(c.name.toUpperCase().indexOf(t)<0)continue;
      if(!want||!c.bank||(c.bank).indexOf(want)>=0)return c.id;}
  }
  return null;
}
function buildRows(text){
  const det=stmtMeta(text);if(!det.bank)return [];
  let rows=det.bank==='boc'?parseBOC(text,det.year,det.mon)
    :det.bank==='sc'?parseSC(text,det.year,det.mon)
    :det.bank==='mox'?parseMOX(text,det.year,det.mon)
    :det.bank==='hsbc'?parseHSBC(text,det.year,det.mon)
    :det.bank==='aeon'?parseAEON(text,det.year,det.mon)
    :[];
  const gid=guessCard(text)||null,def=(S.data.cards[0]||{}).id||null;
  const fp=det.bank+'|'+det.year+'-'+String(det.mon).padStart(2,'0');   /* 月結單指紋：同一份重複匯入可識別 */
  rows.forEach(r=>{if(!r.cardId)r.cardId=gid||IMPPDF.cardId||def;r.fp=fp;if(!r.merchant&&r.kind!=='tx')r.merchant=(r.kind==='payment'?'信用卡還款':'退款');});
  return rows;
}
async function pdfsToTexts(files){
  if(pdfjsLib&&pdfjsLib.GlobalWorkerOptions&&!pdfjsLib.GlobalWorkerOptions.workerSrc){
    const el=document.querySelector('script[src*="pdf.min.js"]');
    const base=(el&&el.src)||'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    pdfjsLib.GlobalWorkerOptions.workerSrc=base.replace('pdf.min.js','pdf.worker.min.js');
  }

    let t='';
    for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();t+='\n'+pageText(c.items);}

/* 依座標重建可讀文字（Mox/HSBC 交易列需行級重排）；pageLines 額外保留每行的 y 座標與字級，供 PDF 對賬高亮用 */
function pageLines(items){
  const toks=[];
  for(const it of items){if(!it.str)continue;const t=it.transform||[1,0,0,1,0,0];const fs=Math.max(4,Math.min(30,it.height||Math.abs(t[3])||8));toks.push({x:t[4],y:t[5],fs,str:it.str,w:it.width||(it.str.length*fs*0.5)});}
  toks.sort((a,b)=>a.y-b.y);const lines=[];
  for(const tk of toks){const tol=Math.max(2,Math.min(3.5,tk.fs*0.4));let L=null;for(const l of lines){if(Math.abs(l.y-tk.y)<=tol){L=l;break;}}if(L){L.toks.push(tk);L.y=(L.y+tk.y)/2;}else lines.push({y:tk.y,toks:[tk]});}
  lines.sort((a,b)=>b.y-a.y);const out=[]; /* PDF 座標 Y 軸向上：由大至小 = 頁面由上至下 */
  for(const l of lines){l.toks.sort((a,b)=>a.x-b.x);let pe=null;const p=[];let fs=0;for(const w of l.toks){if(pe!=null&&(w.x-pe)>Math.max(1.2,w.fs*0.25))p.push(' ');p.push(w.str);pe=Math.max(pe||0,w.x+w.w);fs=Math.max(fs,w.fs);}out.push({y:l.y,fs,text:p.join('').replace(/[ \t]+/g,' ').trim()});}
  return out.filter(L=>L.text);
}
function pageText(items){return pageLines(items).map(L=>L.text).join('\n');}

/* ============ 對賬：定位並高亮 PDF 中的某一筆 ============ */
const PDFVIEW={sid:null,doc:null,name:'',numPages:1,page:1,focus:null,lines:new Map()};
const PDF_STOP=new Set(['HONG','KONG','HKG','CHINA','CHN','LIMITED','COMPANY','APPLE','PAY','CREDIT','CARD']);
function pdfFocusOf(rec){
  const dt=String(rec.date||'');
  const dd=+dt.slice(8,10),mo=MONA[+dt.slice(5,7)-1]||'';
  const dateTks=[];
  if(dd&&mo)dateTks.push(dd+'-'+mo,dd+' '+mo,dd+mo);
  if(dt.length>=10&&dd)dateTks.push(dd+'/'+dt.slice(5,7));
  const merchTk=normTk(rec.merchant||rec.srcMerch||'').split(' ')
    .filter(w=>w.length>=4&&!PDF_STOP.has(w)).sort((a,b)=>b.length-a.length).slice(0,4);
  return {amount:+rec.amount||0,merchTk,dateTks};
}
function normTk(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9\u4e00-\u9fff]+/g,' ');}
function amtIn(text,a){   /* 金額須為獨立數字，避免 3.00 誤中 33.00；千分位一併處理；整數金額也接受無小數寫法（如 WAKU COIN 215） */
  const v=r2(a);const s=v.toFixed(2);
  const pats=[s.replace('.','\\.')];
  if(v===Math.round(v))pats.push(String(Math.round(v)));   /* 整數：另以無小數形式比對（前後不得為數字/逗點/小數點） */
  const T=String(text);
  for(const p of pats){
    const tail=p.indexOf('\\.')>=0?'([^0-9]|$)':'([^0-9.,]|$)';
    const rx=new RegExp('(^|[^0-9.,])'+p+tail);
    if(rx.test(T)||rx.test(T.replace(/,/g,'')))return true;
  }
  return false;
}
function pdfMatchLine(L,f){
  if(!f)return false;
  const T=String(L.text||'').toUpperCase();if(!T)return false;
  const amtOk=!f.amount||amtIn(T,f.amount);
  const mOk=f.merchTk.length>0&&f.merchTk.some(k=>T.indexOf(k)>=0);
  const dOk=f.dateTks.length>0&&f.dateTks.some(k=>T.indexOf(k)>=0);
  if(f.amount){
    if(!f.merchTk.length&&!f.dateTks.length)return amtOk;   /* 降級②：只按金額 */
    return amtOk&&(mOk||dOk);                                /* ①金額＋（商家或日期） */
  }
  return mOk||dOk;                                            /* 降級③：無金額（金額被改／合成統計值）→ 只按商家／日期 */
}
function pdfScoreLine(L,f){
  if(!f)return 0;
  const T=String(L.text||'').toUpperCase();let s=0;
  for(const k of f.merchTk)if(T.indexOf(k)>=0)s+=2;
  for(const k of f.dateTks)if(T.indexOf(k)>=0)s+=1.5;
  if(f.amount&&amtIn(T,f.amount))s+=3;
  return s;
}
async function pdfViewLines(p){
  if(PDFVIEW.lines.has(p))return PDFVIEW.lines.get(p);
  const pg=await PDFVIEW.doc.getPage(p);
  const c=await pg.getTextContent();
  const Ls=pageLines(c.items);
  PDFVIEW.lines.set(p,Ls);
  return Ls;
}
async function pdfFindPage(f){
  let best=null;
  for(let p=1;p<=PDFVIEW.numPages;p++){
    for(const L of await pdfViewLines(p)){
      if(!pdfMatchLine(L,f))continue;
      const s=pdfScoreLine(L,f);
      if(!best||s>best.s)best={p,s};
    }
  }
  return best;
}

async function pdfAutoLocate(){

    let hit=await pdfFindPage(f);
    if(!hit&&f.amount)hit=await pdfFindPage({amount:f.amount,merchTk:[],dateTks:[]});
    if(!hit)hit=await pdfFindPage({amount:0,merchTk:f.merchTk,dateTks:f.dateTks});

async function pdfRenderPage(){
  const stage=$('pdf-stage');if(!stage||!PDFVIEW.doc)return;
  stage.querySelectorAll('canvas').forEach(c=>c.remove());   /* 翻頁時移除舊畫布 */
  const cv=document.createElement('canvas');
  stage.insertBefore(cv,stage.firstChild);
  const pg=await PDFVIEW.doc.getPage(PDFVIEW.page);
  const W=Math.max(240,Math.min(stage.clientWidth||620,680));
  const base=pg.getViewport({scale:1});
  const vp=pg.getViewport({scale:W/base.width});
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.floor(vp.width*dpr);cv.height=Math.floor(vp.height*dpr);
  cv.style.width=Math.floor(vp.width)+'px';cv.style.height=Math.floor(vp.height)+'px';
  const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  await pg.render({canvasContext:ctx,viewport:vp}).promise;
  const ind=$('pdf-pg');if(ind)ind.textContent=PDFVIEW.page;
  stage.querySelectorAll('.pdf-nav [data-action="pdf-page"]').forEach(b=>{
    const p=+b.dataset.p;
    b.disabled=(PDFVIEW.page+p)<1||(PDFVIEW.page+p)>PDFVIEW.numPages;
  });
  const busy=$('pdf-busy');if(busy)busy.remove();
  await pdfDrawHL(vp);
}
async function pdfDrawHL(vp){
  const hl=$('pdf-hl');if(!hl)return;
  hl.innerHTML='';
  const f=PDFVIEW.focus;if(!f)return;
  const Ls=await pdfViewLines(PDFVIEW.page);
  for(const L of Ls){
    if(!pdfMatchLine(L,f))continue;
    const p1=vp.convertToViewportPoint(0,L.y+(L.fs||9)*0.3);
    const p2=vp.convertToViewportPoint(0,L.y-(L.fs||9)*0.85);
    const top=Math.min(p1[1],p2[1]),h=Math.max(10,Math.abs(p2[1]-p1[1]));
    const d=document.createElement('div');
    d.className='pdf-hl-band';d.style.top=top+'px';d.style.height=h+'px';
    hl.appendChild(d);
  }
  if(hl.firstChild){
    const target=hl.firstChild;   /* 捲到第一個（通常是最上方）命中行 */
    setTimeout(()=>{target.scrollIntoView({block:'center',behavior:'smooth'});},120);
  }
}

async function aiChat(prompt){

  let res;

    res=await fetch(base+'/chat/completions',
      {method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.key},
       body:JSON.stringify({model:c.model||'gpt-4o-mini',temperature:0,messages:msgs}),signal:ac?ac.signal:undefined});

  }finally{if(timer)clearTimeout(timer);}

function aiNetErr(e,base){

    const off=(typeof navigator!=='undefined'&&navigator.onLine===false)?'偵測到裝置目前離線。':'';
    return '連不到 AI 服務（'+host+'）。'+off

    +'{\"say\":\"給用戶看的回覆\",\"fix\":[{\"i\":編號,\"category\":\"分類id\",\"online\":true/false/null,\"merchant\":\"新商家名\",\"date\":\"YYYY-MM-DD\",\"amount\":金額數字,\"kind\":\"tx/rebate/payment/credit\",\"card\":\"卡片id或名稱\"}],\"del\":[要刪除的編號],\"add\":[{\"kind\":\"tx/rebate/payment/credit\",\"date\":\"YYYY-MM-DD\",\"amount\":金額,\"merchant\":\"商家\",\"category\":\"分類id\",\"online\":true/false,\"card\":\"卡片id或名稱\"}],\"learn\":[{\"pattern\":\"商家關鍵字\",\"category\":\"分類id\",\"online\":true/false}],\"forget\":[\"要忘記的商家關鍵字\"]}'
    +'\n說明：'
    +'\n· fix 可改任何欄位，只填要改的（其餘省略）；i 對應 #編號。金額一律 HK$ 數字（如 15.28）。kind：tx=消費、rebate=回贈、payment=還款、credit=退款。'
    +'\n· del：用戶說某筆「不要抓／不要匯入／刪掉」時填該筆編號。'
    +'\n· add：用戶要新增一行時填（如積分獎賞、手工補一筆）。AEON 積分換算：250 分＝HK$1（25000分≈HK$100）；WAKU COIN：1 coin＝HK$1。日期用結單月份內的日期（結帳日附近），不知就填該月 1 日。'
    +'\n· learn：該商家之後應自動沿用就填（pattern 取商家名最具代表性的字串，例如 MCDONALD、KOWLOON MOTO，之後模糊比對）；forget：用戶要忘記某規則時填。'
    +'\n· 只回答問題不修改時，fix/del/add/learn/forget 全填空陣列。'
    +'\n線上/實體判斷：含網購平台、App Store、訂票網等為 online:true；實體店、餐廳、交通工具為 false。';
}
/* 結單月份（YYYY-MM）：從行指紋或 PDF 指紋推，供 AI 填日期、也供新增行預設 */
function aiStmtMonth(){
  const cand=[];
  if(IMPPDF.pdfs&&IMPPDF.pdfs.length)cand.push(IMPPDF.pdfs[0].fp);
  if(IMPPDF.rows&&IMPPDF.rows.length)cand.push(IMPPDF.rows[0].fp);
  for(const c of cand){
    const m=/(?:^|\|)(\d{4})-(\d{2})/.exec(String(c||''));
    if(m)return m[1]+'-'+m[2];
  }
  return '';
}
function aiParseReply(res){
  const raw=String(res||'').trim().replace(/```json|```/g,'');
  const m=/\{[\s\S]*\}/.exec(raw);
  if(m){try{const o=JSON.parse(m[0]);if(o&&typeof o==='object')return o;}catch(e){}}
  return {say:raw||'（AI 沒有回應）',fix:[],learn:[],forget:[]};   /* 非 JSON → 當純文字對話 */
}
/* 卡片解析：AI 給 id 或名稱（可部分）都能對上 */
function aiCardOf(v){
  if(v==null)return null;
  const s=String(v).trim();if(!s)return null;
  const cards=S.data.cards||[];
  for(const c of cards)if(c.id===s)return c.id;
  const U=normMerchant(s);
  for(const c of cards){const N=normMerchant(c.name);if(N&&U&&(N.indexOf(U)>=0||U.indexOf(N)>=0))return c.id;}
  return null;
}
const AI_KINDS=['tx','rebate','payment','credit'];
function aiApplyReply(r){
  const valid=S.data.categories.map(c=>c.id);
  let fixed=0,learned=0,forgot=0,deleted=0,added=0;const notes=[];
  for(const f of(r.fix||[])){
    const row=IMPPDF.rows[+f.i];if(!row)continue;
    let hit=false;const bits=[];
    if(f.category&&valid.indexOf(f.category)>=0&&f.category!==row.category){
      const c=catById(f.category);
      row.category=f.category;hit=true;
      bits.push('分類→'+(c?c.name:f.category));
    }
    if(f.online===true||f.online==='true'||f.online===1){if(row.online!==true){row.online=true;hit=true;}bits.push('網上');}
    else if(f.online===false||f.online==='false'||f.online===0){if(row.online!==false){row.online=false;hit=true;}bits.push('門市');}
    if(f.merchant&&String(f.merchant).trim()&&String(f.merchant).trim()!==row.merchant){row.merchant=String(f.merchant).trim();hit=true;bits.push('商家→'+row.merchant);}
    if(f.date&&/^\d{4}-\d{2}-\d{2}$/.test(String(f.date))&&f.date!==row.date){row.date=String(f.date);hit=true;bits.push('日期→'+row.date);}
    if(f.amount!=null&&isFinite(+f.amount)&&+f.amount>0&&num(+f.amount)!==num(row.amount)){row.amount=num(+f.amount);hit=true;bits.push('金額→HK$'+num(row.amount).toFixed(2));}
    const nk=String(f.kind||'').toLowerCase();
    if(nk&&AI_KINDS.indexOf(nk)>=0&&(row.kind||'tx')!==nk){row.kind=nk;hit=true;bits.push('類型→'+(KINDS[nk]||KINDS.tx).n);}
    const nc=aiCardOf(f.card);
    if(nc&&nc!==row.cardId){row.cardId=nc;hit=true;bits.push('卡片→'+((cardById(nc)||{}).name||nc));}
    if(hit){fixed++;notes.push('#'+f.i+' '+(bits.join('、')||'已修改'));}
  }
  /* 刪除：由大到小 splice，編號不亂；列表與編號即時重排 */
  if(r.del&&r.del.length){
    const idx=[...new Set(r.del.map(x=>+x))].filter(i=>i>=0&&i<IMPPDF.rows.length).sort((a,b)=>b-a);
    for(const i of idx){
      const row=IMPPDF.rows[i];
      notes.push('已刪 #'+i+'（'+((row.merchant||'').slice(0,24)||'空白')+' HK$'+num(row.amount).toFixed(2)+'）');
      IMPPDF.rows.splice(i,1);deleted++;
    }
    IMPPDF.openEdits={};   /* 行號已位移，清掉舊的單筆編輯狀態 */
  }
  /* 新增：日期缺 → 結單月份 1 日；卡片缺 → 對話前所選卡；kind 缺 → tx */
  for(const a of(r.add||[])){
    if(!a)continue;
    const amount=num(a.amount);
    if(!(amount>0)){continue;}
    let date=String(a.date||'');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){
      const sm=aiStmtMonth();
      date=sm?sm+'-01':todayStr();
    }
    const kind=AI_KINDS.indexOf(String(a.kind||'').toLowerCase())>=0?String(a.kind).toLowerCase():'tx';
    const cardId=aiCardOf(a.card)||IMPPDF.cardId||(S.data.cards[0]||{}).id;
    if(!cardId)continue;
    const merchant=String(a.merchant||'').replace(/\s+/g,' ').trim()||'(AI 新增)';
    const category=valid.indexOf(a.category)>=0?a.category:'other';
    const online=a.online===true?true:a.online===false?false:null;
    IMPPDF.rows.push({kind,date,amount,merchant,category,online,cardId});
    added++;
    notes.push('已加 '+(KINDS[kind]||KINDS.tx).n+'：'+merchant+' HK$'+amount.toFixed(2)+'（'+date+' · '+((cardById(cardId)||{}).name||cardId)+'）');
  }
  if((r.learn&&r.learn.length)||(r.forget&&r.forget.length)){
    mutate(dd=>{
      for(const l of(r.learn||[])){
        if(!l||!l.pattern||!l.category||valid.indexOf(l.category)<0)continue;
        rememberLabel(dd,l.pattern,l.category,l.online==null?null:!!l.online,'ai');
        learned++;
      }
      for(const p of(r.forget||[])){
        const P=normMerchant(p);if(!P)continue;
        const before=(dd.knowledge||[]).length;
        dd.knowledge=(dd.knowledge||[]).filter(k=>normMerchant(k.pattern)!==P);
        if((dd.knowledge||[]).length<before)forgot++;
      }
    });
  }
  return {fixed,learned,forgot,deleted,added,notes};
}
/* 發送一句到 AI（送出與重試共用）：失敗時錯誤泡泡附 retryText，可直接一鍵重發，不必重打整段 */
async function aiChatSendText(text){
  if(IMPPDF.chatBusy)return;
  IMPPDF.chat=IMPPDF.chat||[];
  IMPPDF.chat.push({role:'user',content:text});
  IMPPDF.chatBusy=true;
  openSheet(aiChatSheet());
  const l=$('ai-chat-log');if(l)l.scrollTop=l.scrollHeight;
  try{
    const res=await aiChat([{role:'system',content:aiChatSysPrompt()}].concat(IMPPDF.chat));
    const r=aiParseReply(res);
    const meta=aiApplyReply(r);
    meta.say=String(r.say||'…');
    IMPPDF.chat.push({role:'assistant',content:String(res),meta});
    const acts=[];
    if(meta.fixed)acts.push('修正 '+meta.fixed+' 筆');
    if(meta.deleted)acts.push('刪除 '+meta.deleted+' 筆');
    if(meta.added)acts.push('新增 '+meta.added+' 筆');
    if(meta.learned)acts.push('學習 '+meta.learned+' 條記憶');
    if(meta.forgot)acts.push('忘記 '+meta.forgot+' 條');
    if(acts.length)toast('已'+acts.join('、')+'，回「確認頁」可查看','ok');
  }catch(e){
    IMPPDF.chat.push({role:'assistant',content:'',meta:{say:'連線失敗：'+(e.message||e),err:true,retryText:text}});
    toast('AI 對話失敗，詳見泡泡內說明（可一鍵重試）','err');
  }
  IMPPDF.chatBusy=false;
  openSheet(aiChatSheet());
  const l2=$('ai-chat-log');if(l2)l2.scrollTop=l2.scrollHeight;
  const i2=$('ai-chat-in');if(i2)i2.focus();
}

      const all=[];let gDet=null;const pdfs=[];

        const seg=buildRows(f.text);
